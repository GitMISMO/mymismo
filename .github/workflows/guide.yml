name: Hotel and Travel Guide
# Copies the website's Hotel and Travel page (www.mismo.org/events/hotel) into data/guide.json for MyMISMO's Explore tab,
# the Summit page's welcome (www.mismo.org/events/summit) into data/event.json for the summit Home, and the Agenda
# page's session logos (www.mismo.org/events/agenda) into data/agenda-tags.json.
# Runs every morning and afternoon, whenever this job or its script changes, and by hand (Run workflow).
# If a page can't be read or comes back without what the app needs, that file isn't written and the job
# fails, so the app keeps the last good guide and the Failure Watcher picks it up.
on:
  schedule:
    - cron: '17 13 * * *'
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_guide.py', '.github/workflows/guide.yml', 'tests/guide-page.html', 'tests/summit-page.html', 'tests/agenda-page.html']
permissions:
  contents: write
concurrency:
  group: guide
  cancel-in-progress: false
jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The parser still reads the three pages' layouts
        run: python3 tools/build_guide.py --html tests/guide-page.html --out /tmp/check.json --summit-html tests/summit-page.html --event-out /tmp/event.json --agenda-html tests/agenda-page.html --tags-out /tmp/tags.json
      - name: Read the website's Hotel and Travel, Summit and Agenda pages
        run: python3 tools/build_guide.py || echo "GUIDE_FAILED=1" >> "$GITHUB_ENV"
      - name: Save
        run: |
          git config user.name "MyMISMO Guide"
          git config user.email "jcritchley@mismo.org"
          git add -A data/
          if git diff --cached --quiet; then echo "No change."; else git commit -m "Hotel and Travel guide, summit welcome and agenda logos from mismo.org" && git push; fi
      - name: Fail if a page couldn't be read (the other was still saved)
        if: env.GUIDE_FAILED == '1'
        run: exit 1
