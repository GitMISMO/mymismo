name: Hotel and Travel Guide
# Copies the website's Hotel and Travel page (www.mismo.org/events/hotel) into data/guide.json for MyMISMO's Explore tab,
# the Summit page's welcome (www.mismo.org/events/summit) into data/event.json for the summit Home, and the Agenda
# page's session logos (www.mismo.org/events/agenda) into data/agenda-tags.json, and the MISMO team and Board headshots
# (About MISMO and MISMO Leadership) into data/faces.json for the attendee list, and the workgroup sponsors on the
# Workgroup Meeting Schedule (www.mismo.org/get-involved/meeting-schedule) into data/wg-sponsors.json for Join a Workgroup,
# and the News page's releases (www.mismo.org/about-mismo/news) into data/news.json for the News tile.
# Runs every morning and afternoon, whenever this job or its script changes, and by hand (Run workflow).
# If a page can't be read or comes back without what the app needs, that file isn't written and the job
# fails, so the app keeps the last good guide and the Failure Watcher picks it up.
on:
  schedule:
    - cron: '17 13 * * *'
    - cron: '17 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_guide.py', '.github/workflows/guide.yml', 'tests/groups-page.html', 'tests/schedule-page.html', 'tests/edu-page.html', 'tests/about-page.html', 'tests/leadership-page.html', 'tests/guide-page.html', 'tests/summit-page.html', 'tests/agenda-page.html', 'tests/provider-page.html', 'tests/directory-page.html', 'tools/build_providers.py', 'tools/build_logos.py', 'tools/build_news.py', 'tests/news-page.html']
permissions:
  contents: write
concurrency:
  group: guide
  cancel-in-progress: false
jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The parser still reads the three pages' layouts
        run: python3 tools/build_guide.py --html tests/guide-page.html --out /tmp/check.json --summit-html tests/summit-page.html --event-out /tmp/event.json --agenda-html tests/agenda-page.html --tags-out /tmp/tags.json --groups-html tests/groups-page.html --groups-out /tmp/wg.json --edu-html tests/edu-page.html --edu-out /tmp/ai.json --about-html tests/about-page.html --leadership-html tests/leadership-page.html --faces-out /tmp/faces.json --schedule-html tests/schedule-page.html --wg-sponsors-out /tmp/wgs.json
      - name: The News parser still reads the News page's layout
        run: python3 tools/build_news.py --html tests/news-page.html --out /tmp/news.json
      - name: The provider page parser still reads the website's layout
        run: python3 tools/build_providers.py --provider-html tests/provider-page.html > /dev/null && python3 tools/build_providers.py --directory-html tests/directory-page.html > /dev/null
      - name: Read the website's Hotel and Travel, Summit, Agenda, Workgroups, Meeting Schedule, About and Leadership pages
        run: python3 tools/build_guide.py || echo "GUIDE_FAILED=1" >> "$GITHUB_ENV"
      - name: Read the certified providers' pages and make the home-page pictures
        run: |
          pip install --quiet pillow
          sudo apt-get install -y -qq tesseract-ocr > /dev/null || echo "No tesseract: pictures are checked by how blank they are only"
          python3 tools/build_providers.py || echo "GUIDE_FAILED=1" >> "$GITHUB_ENV"
      - name: Read the website's News page
        run: python3 tools/build_news.py || echo "GUIDE_FAILED=1" >> "$GITHUB_ENV"
      - name: Which sponsor logos have a see-through background (for dark mode)
        run: python3 tools/build_logos.py || echo "GUIDE_FAILED=1" >> "$GITHUB_ENV"
      - name: Save
        run: |
          git config user.name "MyMISMO Guide"
          git config user.email "jcritchley@mismo.org"
          git add -A data/
          if git diff --cached --quiet; then echo "No change."; else git commit -m "Hotel and Travel guide, summit welcome, agenda logos, certified providers and home-page pictures" && for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done; fi
      - name: Fail if a page couldn't be read (the other was still saved)
        if: env.GUIDE_FAILED == '1'
        run: exit 1
