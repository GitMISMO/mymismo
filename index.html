.chat-who svg{width:14px; height:14px}
.tv-tnote{display:block; margin-top:10px; font-size:12.5px; line-height:1.45; color:rgba(255,255,255,.65)}
.tv-counts{display:flex; width:max-content; margin:0 auto 6px; align-items:center; gap:6px; padding:4px 10px; border-radius:6px; background:rgba(27,175,122,.18); border:1px solid rgba(27,175,122,.55); color:#4fc79b; font-size:12px; font-weight:800}
.tv-counts svg{width:14px; height:14px; flex:none}
.tg-sheet .sheet-body{background:radial-gradient(130% 90% at 50% 0%, #14486e 0%, #071d2e 55%, #040f18 100%)}
.tg{color:#fff; padding:14px 16px 28px; min-height:calc(100vh - 120px); display:flex; flex-direction:column; gap:14px}
.tg-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.tg-dots{display:flex; gap:5px; flex-wrap:wrap}
.tg-dots i{width:14px; height:14px; border-radius:4px; background:rgba(255,255,255,.14)}
.tg-dots i.now{background:#74bfeb; box-shadow:0 0 0 3px rgba(116,191,235,.3)}
.tg-dots i.ok{background:#1baf7a}
.tg-dots i.no{background:#eb6834}
.tg-score{text-align:right}
.tg-score span{display:block; font-size:11.5px; font-weight:700; color:rgba(255,255,255,.6)}
.tg-score b{font-family:var(--cond); font-size:28px; line-height:1}
.tg-mid{position:relative; width:110px; height:110px; margin:0 auto}
.tg-clock{width:100%; height:100%; transform:rotate(-90deg)}
.tg-clock circle{fill:none; stroke-width:9}
.tg-clock .bg{stroke:rgba(255,255,255,.1)}
.tg-clock .fg{stroke-dasharray:326.7; stroke-linecap:round; filter:drop-shadow(0 0 6px currentColor)}
.tg-mid b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--cond); font-size:40px}
.tg-mid b.hurry{color:#eb6834; animation:tv-bob .5s ease-in-out infinite}
.tg-card{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-top:4px solid var(--cc); border-radius:16px; padding:16px; animation:tile-in .35s cubic-bezier(.2,.8,.2,1) both}
.tg-cat{display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:700; color:var(--cc)}
.tg-cat i{width:10px; height:10px; border-radius:50%; background:var(--cc); box-shadow:0 0 8px var(--cc)}
.tg-qn{float:right; font-size:12.5px; color:rgba(255,255,255,.55); font-weight:600}
.tg-card h3{font-family:var(--cond); font-size:clamp(22px, 6vw, 28px); line-height:1.15; margin-top:10px; clear:both}
.tg-ans{display:grid; gap:9px}
@media (min-width:640px){ .tg-ans{grid-template-columns:1fr 1fr} }
.tg-a{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center; text-align:left; background:#fff; color:#0d314c; border:0; border-radius:12px; padding:12px 14px; font:inherit; font-weight:600; font-size:15.5px; cursor:pointer; box-shadow:0 8px 20px -12px rgba(0,0,0,.6); animation:tile-in .35s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d); transition:transform .12s ease, background .2s ease, opacity .2s ease}
.tg-a:active{transform:scale(.97)}
.tg-l{width:32px; height:32px; border-radius:8px; display:grid; place-items:center; background:#e4f2fb; font-weight:800; color:#14486e}
.tg-a.right{background:#1baf7a; color:#fff; animation:tg-pop .4s ease}
.tg-a.right .tg-l{background:rgba(255,255,255,.25); color:#fff}
.tg-a.wrong{background:#eb6834; color:#fff; animation:tg-shake .4s ease}
.tg-a.wrong .tg-l{background:rgba(255,255,255,.25); color:#fff}
.tg-a.dim{opacity:.35}
.tg-streak{align-self:center; display:inline-flex; align-items:center; gap:6px; font-weight:800; color:#eda100; font-size:14px}
.tg-streak svg{width:16px; height:16px}
.tg-fx{position:fixed; left:50%; top:30%; transform:translate(-50%,-50%); z-index:50; text-align:center; pointer-events:none; animation:tg-rise 1.3s ease forwards; background:rgba(4,15,24,.88); border:1px solid rgba(255,255,255,.15); border-radius:16px; padding:14px 26px; min-width:200px; box-shadow:0 18px 40px -12px rgba(0,0,0,.7)}
.tg-fx.no{animation-duration:2.1s}
.tg-fx b{display:block; font-family:var(--cond); font-size:56px; line-height:1; text-shadow:0 6px 24px rgba(0,0,0,.5)}
.tg-fx.ok b{color:#74ffc4}
.tg-fx.no b{color:#ffb08f; font-size:40px}
.tg-fx span{display:block; font-weight:700; margin-top:6px; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.6)}
@keyframes tg-pop{50%{transform:scale(1.04)}}
@keyframes tg-shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes tg-rise{0%{opacity:0; transform:translate(-50%,-30%) scale(.7)}20%{opacity:1; transform:translate(-50%,-50%) scale(1.08)}80%{opacity:1}100%{opacity:0; transform:translate(-50%,-80%) scale(1)}}
.tg-end{position:relative; text-align:center; padding-top:20px}
.tg-big{font-family:var(--cond); font-size:clamp(72px, 22vw, 120px); line-height:1; margin:14px 0 6px; background:linear-gradient(180deg, #fff, #74bfeb); -webkit-background-clip:text; background-clip:text; color:transparent}
.tg-end p{color:rgba(255,255,255,.8); margin:0 0 16px}
.tg-cats{display:grid; grid-template-columns:1fr 1fr; gap:8px; text-align:left}
.tg-cats div{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; background:rgba(255,255,255,.07); border-radius:10px; padding:9px 11px}
.tg-cats i{width:10px; height:10px; border-radius:50%; background:var(--cc)}
.tg-cats b{font-size:13px}
.tg-cats span{font-family:var(--cond); font-weight:700}
.tg-btns{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px}
.tg-btns .btn{justify-content:center}
.tg-btns .btn:not(.primary){background:rgba(255,255,255,.1); color:#fff; border-color:rgba(255,255,255,.3)}
.tg-review{display:grid; gap:8px; margin-top:14px; text-align:left}
.tg-r{background:rgba(255,255,255,.07); border-left:4px solid #1baf7a; border-radius:10px; padding:10px 12px}
.tg-r.no{border-left-color:#eb6834}
.tg-r b{display:block; font-size:14px}
.tg-r span{display:block; color:rgba(255,255,255,.8); font-size:13.5px; margin:3px 0}
.tg-r a{display:inline-flex; align-items:center; gap:4px; color:#74bfeb; font-size:12.5px; font-weight:700; text-decoration:none}
.tg-r a svg{width:12px; height:12px}
.tg-confetti{position:absolute; inset:-20px 0 auto; height:0; pointer-events:none}
.tg-confetti i{position:absolute; left:var(--x); top:0; width:8px; height:14px; background:var(--c); border-radius:2px; animation:tg-fall 2.2s ease-in forwards; animation-delay:var(--d); opacity:0}
@keyframes tg-fall{0%{opacity:1; transform:translateY(0) rotate(0)}100%{opacity:0; transform:translateY(420px) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){ .tg *, .tv-go{animation:none !important} }

/* Settings */
.set-input{display:block; width:100%; margin-top:8px; font:inherit; font-size:16px; color:var(--ink); background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; padding:9px 11px}
.set-input:focus{outline:2px solid var(--sky); outline-offset:1px}
.dh-name{display:block; margin-top:6px; font-size:14px}
.set .d-h:first-child{margin-top:4px}
.set-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden}
.set-row{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 14px; border-top:1px solid var(--border); color:var(--ink); text-decoration:none}
.set-row:first-child{border-top:0}
.set-ic{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; background:var(--surface-3); color:var(--link)}
.set-ic svg{width:18px; height:18px}
.set-tx b{display:block; font-size:15px}
.set-tx span{display:block; color:var(--ink-2); font-size:13px; line-height:1.4; margin-top:2px}
.set-row.link > svg{width:16px; height:16px; color:var(--ink-3)}
.btn.small.danger{background:var(--bad); border-color:var(--bad); color:#fff}
.tgl{width:50px; height:30px; border-radius:15px; border:0; background:var(--border-strong); position:relative; cursor:pointer; flex:none; transition:background .2s ease}
.tgl i{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(6,32,47,.35); transition:transform .2s ease}
.tgl.on{background:var(--good)}
.tgl.on i{transform:translateX(20px)}
#rs-account[hidden]{display:none}
#rs-account{display:inline-flex; align-items:center}

/* My Schedule, before anything is added */
.empty-sched{display:grid; justify-items:center; text-align:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:28px 20px 24px; margin-top:6px}
.es-star{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb, var(--star) 22%, transparent); color:var(--star)}
.es-star svg{width:32px; height:32px}
.empty-sched b{font-family:var(--cond); font-size:22px}
.empty-sched p{color:var(--ink-2); max-width:34ch; margin:0 0 8px}

/* Sponsor band (foot of Home and Explore): one scrolling row of logos, each with its level */
.spband{position:relative; overflow:hidden; isolation:isolate; margin:28px -14px 8px; border-radius:0; color:#fff; background:#071d2e; padding:24px 0 22px; box-shadow:0 18px 40px -22px rgba(6,32,47,.7)}
.spband > .hero-art{z-index:-1; opacity:.9}
.spband h2{font-family:var(--cond); font-size:clamp(26px, 7.5vw, 38px); line-height:1.05; letter-spacing:-.015em; text-align:center; margin:0 16px 18px}
.sb-all{display:flex; align-items:center; gap:7px; margin:16px auto 0; padding:10px 16px; border-radius:8px; border:1px solid rgba(116,191,235,.55); background:rgba(116,191,235,.12); color:#fff; font:inherit; font-size:14px; font-weight:700; cursor:pointer}
.sb-all:hover{background:rgba(116,191,235,.22)}
.sb-all svg{width:17px; height:17px; color:#74bfeb}
.sb-run{overflow:hidden; -webkit-mask-image:linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image:linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent)}
.sb-run .run{display:flex; width:max-content}
.sbt{margin-right:14px}
.sb-run.go .run{animation:tick var(--dur) linear infinite}
.sb-run.go:hover .run, .sb-run.go:focus-within .run{animation-play-state:paused}
.sbt{flex:none; display:grid; gap:8px; justify-items:center; background:none; border:0; padding:0; cursor:pointer; color:#fff; font:inherit}
.sbt-logo{width:190px; height:96px; display:grid; place-items:center; background:#fff; border-radius:12px; padding:12px 16px; border-bottom:4px solid var(--tierc); box-shadow:0 10px 22px -14px rgba(0,0,0,.6)}
.sbt-logo img{max-width:100%; max-height:66px; object-fit:contain}
.sbt-logo b{color:#0d314c; font-size:15px}
.sbt-tier{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:rgba(255,255,255,.9)}
.sbt-tier i{width:12px; height:12px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, var(--tierc) 60%)}
/* each level dressed a step up from the one below: Bronze a colored edge, Silver a full silver frame, Gold a gold frame
   with a warm glow and a star, Platinum (and anything above) a polished platinum frame, a glow, a star and a slow shine */
.sbt-logo{position:relative; overflow:hidden}
.sbt-silver .sbt-logo{border:3px solid transparent; border-bottom-width:3px; background:linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, #e9eef2, #9aa6b1 45%, #f4f7f9 60%, #8c98a3) border-box}
.sbt-gold .sbt-logo{border:4px solid transparent; background:linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, #f7dc8a, #c99a2e 40%, #fff1c2 55%, #a87a1c) border-box;
  box-shadow:0 0 0 1px rgba(255,214,120,.35), 0 12px 28px -12px rgba(233,178,60,.75)}
.sbt-platinum .sbt-logo, .sbt-diamond .sbt-logo, .sbt-presenting .sbt-logo, .sbt-title .sbt-logo{border:4px solid transparent;
  background:linear-gradient(#fff, #fff) padding-box, conic-gradient(from 210deg, #f6f9fc, #a9b8c6, #ffffff, #74bfeb, #e3eaf0, #8ea2b5, #f6f9fc) border-box;
  box-shadow:0 0 0 1px rgba(255,255,255,.5), 0 0 22px -2px rgba(169,216,243,.55), 0 14px 30px -12px rgba(116,191,235,.8)}
.sbt-platinum .sbt-logo:after, .sbt-diamond .sbt-logo:after, .sbt-presenting .sbt-logo:after, .sbt-title .sbt-logo:after{content:""; position:absolute; top:-20%; bottom:-20%; width:38%; left:-60%;
  background:linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); transform:skewX(-18deg); animation:sbt-shine 5.5s ease-in-out infinite; pointer-events:none}
@keyframes sbt-shine{0%, 62%{left:-60%} 100%{left:130%}}
.sbt-mark{position:absolute; top:5px; right:6px; width:20px; height:20px; display:grid; place-items:center; border-radius:50%}
.sbt-mark svg{width:13px; height:13px; --star-fill:currentColor}
.sbt-gold .sbt-mark{background:#fff4d6; color:#b8860b}
.sbt-platinum .sbt-mark, .sbt-diamond .sbt-mark, .sbt-presenting .sbt-mark, .sbt-title .sbt-mark{background:#e9f2f9; color:#5f7f9c}
.sbt-platinum .sbt-tier, .sbt-gold .sbt-tier{font-weight:800}
.sbt-platinum .sbt-tier{color:#e9f4fb}
.sbt-gold .sbt-tier{color:#f7dc8a}
@media (prefers-reduced-motion: reduce){ .sbt-logo:after{animation:none !important; display:none} }
@media (prefers-reduced-motion: reduce){ .sb-run .run{animation:none !important} .sb-run{overflow-x:auto} }

/* Floor map */
.mapcard{display:grid; grid-template-columns:120px 1fr auto; gap:14px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:10px; cursor:pointer; color:var(--ink); font:inherit; box-shadow:var(--shadow)}
.mapcard .mc-art{display:block; border-radius:10px; overflow:hidden; background:#d9dad6; pointer-events:none}
.mapcard .fpin span,.mapcard .fmark{display:none}
.mapcard .fpin i{width:7px; height:7px; margin:-3.5px 0 0 -3.5px; box-shadow:none}
.mc-tx b{display:block; font-family:var(--cond); font-size:20px}
.mc-tx span{color:var(--ink-2); font-size:13.5px}
.mapcard > svg{width:20px; height:20px; color:var(--ink-3)}
.fmap-wrap{display:flex; flex-direction:column}
.fmap-top{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 16px 8px}
.fmap-top .seg{margin:0}
.zoom{display:flex; gap:6px}
.zoom .iconbtn{font-size:22px; font-weight:600}
.fmap{overflow:auto; max-height:62vh; background:#d9dad6; -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y}
.fmap-in{width:100%; transition:width .25s ease}
.fband{position:relative; overflow:hidden; width:100%}
.fband img{display:block; width:100%; user-select:none; -webkit-user-drag:none}
.fpin{position:absolute; transform:translate(-50%,-50%); border:0; background:none; padding:0; cursor:pointer; display:flex; align-items:center; gap:4px; z-index:2}
.fpin i{display:block; width:14px; height:14px; border-radius:50%; background:#1a8fe3; border:2px solid #fff; box-shadow:0 1px 4px rgba(6,32,47,.4)}
.fpin span{position:absolute; left:16px; top:50%; transform:translateY(-50%); white-space:nowrap; background:rgba(13,49,76,.88); color:#fff; font-size:11px; font-weight:600; padding:2px 6px; border-radius:4px}
.fpin.on{z-index:3}
.fpin.on i{width:22px; height:22px; background:#eb6834; animation:pinpulse 1.6s ease-out infinite}
.fpin.on span{background:#eb6834; font-size:13px; padding:4px 8px; left:22px}
@keyframes pinpulse{0%{box-shadow:0 0 0 0 rgba(235,104,52,.7)}100%{box-shadow:0 0 0 18px rgba(235,104,52,0)}}
.fm-key{display:flex; flex-wrap:wrap; gap:6px 16px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--surface); font-size:12.5px; color:var(--ink-2)}
.fm-key span{display:inline-flex; align-items:center; gap:7px}
.fm-key i{display:inline-block; width:12px; height:12px; border-radius:50%; flex:none}
.fm-key .k-blue{background:#1a8fe3; border:2px solid #fff; box-shadow:0 0 0 1px rgba(6,32,47,.25)}
.fm-key .k-orange{background:#eb6834; border:2px solid #fff; box-shadow:0 0 0 1px rgba(6,32,47,.25)}
.fm-key .k-line{width:16px; height:12px; border-radius:0; background:linear-gradient(var(--ink),var(--ink)) left center/12px 1.5px no-repeat, radial-gradient(circle, var(--ink) 2.5px, transparent 3px) right center/6px 6px no-repeat}
.fmark{position:absolute; transform:translate(-50%,-50%); font-size:10px; font-weight:700; color:#5b4a1c; background:rgba(255,255,255,.75); border-radius:3px; padding:1px 4px; pointer-events:none}
.rooms{display:grid; gap:6px}
.roomrow{display:grid; grid-template-columns:auto 1fr auto auto; gap:10px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px; cursor:pointer; color:var(--ink); font:inherit}
.roomrow .fl{width:28px; height:28px; border-radius:7px; display:grid; place-items:center; background:#c99a2e; color:#fff; font-family:var(--cond); font-weight:700}
.roomrow > span:not(.fl){color:var(--ink-2); font-size:13px}
.roomrow svg{width:17px; height:17px; color:var(--ink-3)}
.cv-foot{display:flex; align-items:flex-end; gap:10px 12px; flex-wrap:wrap; margin-top:14px}
.cv-foot:empty{display:none}
.cv-foot .spline{margin-top:0}
.findmap{margin-left:auto; display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.4); background:rgba(255,255,255,.14); color:#fff; border-radius:6px; padding:6px 11px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap}
.findmap svg{width:15px; height:15px}
@media (prefers-reduced-motion: reduce){ .fpin.on i{animation:none} }

/* Alerts and slides */
.al-state{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px}
.al-state > svg{width:28px; height:28px; color:#1a8fe3}
.al-state b{display:block; font-size:16px}
.al-state span{color:var(--ink-2); font-size:14px}
.al-state .btn{grid-column:1 / -1}
.al-state.on{border-left:4px solid var(--good)}
.al-state.on > svg{color:var(--good)}
.alerts{display:grid; gap:8px}
.al{background:var(--surface); border:1px solid var(--border); border-left:4px solid #eb6834; border-radius:10px; padding:12px 14px}
.al-t{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.al-t em{font-style:normal; color:var(--ink-3); font-size:12px; white-space:nowrap}
.al p{margin:4px 0 6px; font-size:14.5px}
.problem{color:var(--bad); font-size:13.5px; grid-column:1 / -1; margin:4px 0 0}
.slides-lock{display:grid; grid-template-columns:auto 1fr; gap:10px 12px; align-items:center; background:var(--surface); border:1px dashed var(--border-strong); border-radius:12px; padding:12px 14px}
.slides-lock > svg{width:26px; height:26px; color:var(--link)}
.slides-lock b{display:block}
.slides-lock span{color:var(--ink-2); font-size:13.5px}
.slides-lock .btn{grid-column:1 / -1}
.slides{display:grid; gap:8px}
.slide{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; cursor:pointer; color:var(--ink); font:inherit}
.slide > svg{width:24px; height:24px; color:#b3372c}
.slide b{display:block; font-size:14.5px}
.slide span span{color:var(--ink-2); font-size:12.5px}
.slide em{font-style:normal; font-weight:700; color:var(--link); font-size:13px}


/* ---------- Mic'd Up ---------- */
.mic-hero{position:relative; isolation:isolate; overflow:hidden; background:#071d2e; color:#fff; padding:14px 16px 18px}
.mic-hero > .hero-art{z-index:-1; opacity:.8}
.mic-brand{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px}
.mic-brand b{font-family:var(--cond); font-size:22px; letter-spacing:.01em}
.mic-brand span{font-size:12.5px; font-weight:600; color:var(--sky-soft)}
.mic-now{margin-top:12px; animation:bio-in .3s ease}
.mic-stage .plbl{display:none}
.mic-k{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#06202f; background:var(--sky); border-radius:4px; padding:3px 8px}
.mic-k svg{width:11px; height:11px}
.mic-now h2{font-family:var(--cond); font-size:24px; line-height:1.1; margin:8px 0 4px}
.mic-d{color:rgba(255,255,255,.8); font-size:13.5px}
.eps{display:grid; gap:10px}
.ep{display:grid; grid-template-columns:132px 1fr; gap:12px; align-items:center; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px; cursor:pointer; color:var(--ink); font:inherit}
.ep .th{position:relative; display:block; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:#06202f}
.ep .th img{width:100%; height:100%; object-fit:cover; display:block}
.ep .th em{position:absolute; right:5px; bottom:5px; background:rgba(6,32,47,.85); color:#fff; font-style:normal; font-size:11px; font-weight:600; padding:1px 5px; border-radius:3px}
.ep .th i{position:absolute; inset:0; display:grid; place-items:center; color:#fff; background:rgba(6,32,47,.25); opacity:0; transition:opacity .2s}
.ep .th i svg{width:26px; height:26px}
.ep:hover .th i{opacity:1}
.ep-tx b{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; font-size:14.5px; line-height:1.3}
.ep-tx span{color:var(--ink-2); font-size:12.5px}
.ep.on{border-color:#1a8fe3; box-shadow:0 0 0 1px #1a8fe3}
.ep.on .th i{opacity:1; background:rgba(26,143,227,.45)}

/* ---------- mismo.org ---------- */
.site-hero{position:relative; isolation:isolate; overflow:hidden; background:#071d2e; color:#fff; padding:24px 18px 22px}
.site-hero > .hero-art{z-index:-1}
.site-k{display:inline-flex; gap:7px; align-items:center; font-weight:700; font-size:13px; color:var(--sky-soft)}
.site-k svg{width:16px; height:16px; color:var(--sky)}
.site-hero h2{font-family:var(--cond); font-size:clamp(28px, 8vw, 40px); line-height:1; margin:8px 0 8px; max-width:14ch}
.site-hero p{color:rgba(255,255,255,.85); margin:0; max-width:34ch; font-size:14.5px}
.site-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.site-tile{position:relative; display:flex; flex-direction:column; gap:4px; min-height:150px; padding:14px; border-radius:16px; text-decoration:none; color:var(--ink); background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); overflow:hidden;
  animation:tile-in .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 45ms)}
.site-tile:before{content:""; position:absolute; right:-30px; top:-30px; width:110px; height:110px; border-radius:50%; background:var(--c); opacity:.12}
.st-ic{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:var(--c); color:#fff; margin-bottom:8px}
.st-ic svg{width:22px; height:22px}
.site-tile b{font-family:var(--cond); font-size:18px; line-height:1.1}
.site-tile > span:not(.st-ic):not(.st-go){color:var(--ink-2); font-size:13px; line-height:1.3}
.st-go{position:absolute; right:12px; bottom:12px; color:var(--ink-3)}
.st-go svg{width:15px; height:15px}
@keyframes tile-in{from{opacity:0; transform:translateY(12px) scale(.98)}}
@media (min-width:640px){ .site-grid{grid-template-columns:repeat(4,1fr)} }

/* ---------- Certifications ---------- */
.cert-hero{position:relative; isolation:isolate; overflow:hidden; background:#071d2e; color:#fff; padding:22px 18px 20px}
.cert-hero > .hero-art{z-index:-1}
.cert-seal{position:relative; width:58px; height:58px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%, #ffd98a, #c99a2e 60%, #8a6414); color:#fff; box-shadow:0 0 0 4px rgba(201,154,46,.25)}
.cert-seal:after{content:""; position:absolute; inset:-10px; border-radius:50%; border:2px dashed rgba(240,185,58,.5); animation:bsSpin 18s linear infinite}
@keyframes bsSpin{to{transform:rotate(360deg)}}
.cert-seal svg{width:30px; height:30px}
.cert-hero h2{font-family:var(--cond); font-size:clamp(32px, 9vw, 46px); line-height:1; margin:14px 0 6px}
.cert-hero p{color:rgba(255,255,255,.85); margin:0 0 16px; max-width:34ch; font-size:14.5px}
.cert-nums{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.cert-nums div:last-child:nth-child(odd){grid-column:1 / -1}
@media (min-width:640px){ .cert-nums{grid-template-columns:repeat(4,1fr)} .cert-nums div:last-child:nth-child(odd){grid-column:auto} }
.cert-nums div{background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:10px 12px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.cert-nums b{display:block; font-family:var(--cond); font-size:36px; line-height:1; color:var(--sky)}
.cert-nums span{font-size:12px; font-weight:600; color:rgba(255,255,255,.85)}
.bars{display:grid; gap:8px}
.bar{display:grid; grid-template-columns:minmax(90px, 32%) 1fr auto; gap:10px; align-items:center}
.bar .bl{font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar .bt{height:14px; border-radius:7px; background:var(--surface-3); overflow:hidden}
.bar .bt i{display:block; height:100%; width:0; border-radius:7px; background:linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 70%, #fff)); transition:width 1s cubic-bezier(.2,.8,.2,1); transition-delay:calc(var(--i) * 80ms)}
.sheet.go .bar .bt i{width:var(--w)}
.bar b{font-family:var(--cond); font-size:17px; min-width:24px; text-align:right}
.tl{display:grid; gap:14px}
.tl-h{display:flex; align-items:center; gap:8px; font-family:var(--cond); font-weight:700; font-size:17px; margin-bottom:8px}
.tl-h span{font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; font-weight:700; background:var(--surface-3); color:var(--ink-2); border-radius:4px; padding:1px 6px}
.tl-m{position:relative}
.tl-i{position:relative; display:grid; grid-template-columns:18px 1fr; gap:10px; padding-bottom:8px}
.tl-i:before{content:""; position:absolute; left:8px; top:14px; bottom:-6px; width:2px; background:var(--border)}
.tl-i:last-child:before{display:none}
.tl-dot{width:18px; height:18px; border-radius:50%; background:var(--c); border:3px solid var(--ground); box-shadow:0 0 0 2px var(--c); margin-top:10px; position:relative; z-index:1}
.tl-c{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px}
.tl-top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.tl-top em{font-style:normal; color:var(--ink-3); font-size:12px; font-weight:600; white-space:nowrap}
.tl-p{display:block; color:var(--ink-2); font-size:13.5px}
.tl-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.sparkle{position:relative; overflow:hidden; display:inline-block; font-size:11.5px; font-weight:700; color:#5b4210; background:linear-gradient(135deg, #ffe39a, #f0b93a); border-radius:3px; padding:2px 7px}
.sparkle:after{content:""; position:absolute; top:-40%; left:-80%; width:45%; height:180%; transform:rotate(18deg); background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.8), rgba(255,255,255,0)); animation:sweep 3.5s ease-in-out infinite}
.seg .sc{font-size:11.5px; opacity:.75; margin-left:4px}
.pros{display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); margin-top:10px; max-height:440px; overflow-y:auto}
.pro{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 10px}
.pro .ini{width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; color:#fff; background:linear-gradient(135deg, hsl(var(--h) 55% 45%), hsl(calc(var(--h) + 40) 55% 32%))}
.pro b{display:block; font-size:14px}
.pro span span{color:var(--ink-2); font-size:12.5px}
@media (prefers-reduced-motion: reduce){ .cert-seal:after,.sparkle:after,.site-tile{animation:none} .bar .bt i{transition:none} }

/* Sponsor's home page, small */
.sitepeek{display:block; margin-top:16px; border-radius:12px; overflow:hidden; border:1px solid var(--border-strong); background:var(--surface); box-shadow:0 12px 30px rgba(6,32,47,.18); text-decoration:none; color:var(--ink)}
.pk-bar{display:flex; align-items:center; gap:6px; padding:8px 10px; background:var(--surface-3); border-bottom:1px solid var(--border)}
.pk-bar i{width:10px; height:10px; border-radius:50%; background:#e0533f}
.pk-bar i:nth-child(2){background:#eda100}
.pk-bar i:nth-child(3){background:#1baf7a}
.pk-url{flex:1; display:flex; align-items:center; gap:5px; margin-left:8px; background:var(--surface); border-radius:6px; padding:3px 9px; font-size:12.5px; color:var(--ink-2); overflow:hidden; white-space:nowrap}
.pk-url svg{width:12px; height:12px; flex:none}
.pk-shot{position:relative; display:block; aspect-ratio:4/3; overflow:hidden; background:#fff}
.pk-shot img{display:block; width:100%; height:100%; object-fit:cover; object-position:top; opacity:0; transition:opacity .5s, transform 8s ease}
.sitepeek.ready .pk-shot img{opacity:1}
.sitepeek:hover .pk-shot img{transform:translateY(-6%)}
.pk-wait{position:absolute; inset:0; background:linear-gradient(100deg, var(--surface-2) 30%, var(--surface-3) 50%, var(--surface-2) 70%); background-size:200% 100%; animation:shimmer 1.4s linear infinite}
.sitepeek.ready .pk-wait{display:none}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){ .pk-wait{animation:none} .pk-shot img{transition:none} }

/* Certified provider */
button.tl-c{width:100%; text-align:left; cursor:pointer; color:var(--ink); font:inherit}
button.tl-c:hover{border-color:var(--border-strong)}
.tl-go{margin-left:auto; color:var(--ink-3); display:inline-flex}
.tl-go svg{width:16px; height:16px}
.pv-tag{color:rgba(255,255,255,.85); margin-top:4px}
.pv-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.pv-tags span{font-size:12px; font-weight:700; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:4px; padding:3px 8px}
.cover .k svg{width:13px; height:13px; vertical-align:-2px; margin-right:5px}
.badges{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px}
.badge-c{display:grid; justify-items:center; text-align:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 10px; text-decoration:none; color:var(--ink); animation:tile-in .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 70ms)}
.badge-c img{width:86px; height:86px; object-fit:contain; filter:drop-shadow(0 6px 12px rgba(6,32,47,.2))}
.badge-c b{font-size:14px; line-height:1.25}
.badge-c span{color:var(--link); font-size:12.5px; font-weight:600}
.list .row .tag{margin-left:auto}
.list .row em{font-style:normal; color:var(--ink-3); font-size:12.5px; font-weight:600}
.pv-about p{font-size:15px; line-height:1.6; margin:0 0 10px}

/* Certification tiles */
.ctiles{display:grid; gap:12px}
@media (min-width:640px){ .ctiles{grid-template-columns:1fr 1fr} .ctile.wide{grid-column:1 / -1} }
.ctile{position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-top:5px solid var(--c); border-radius:16px; padding:14px; box-shadow:var(--shadow); animation:tile-in .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 60ms)}
.ctile:before{content:""; position:absolute; right:-40px; top:-40px; width:130px; height:130px; border-radius:50%; background:var(--c); opacity:.08}
.ct-h{display:flex; gap:12px; align-items:center}
.ct-ic{width:46px; height:46px; flex:none; border-radius:12px; display:grid; place-items:center; color:#fff; background:linear-gradient(140deg, var(--c), color-mix(in srgb, var(--c) 55%, #06202f))}
.ct-ic svg{width:24px; height:24px}
.ct-h b{display:block; font-family:var(--cond); font-size:20px; line-height:1.1}
.ct-h > div > span{color:var(--ink-2); font-size:13px; font-weight:600}
.ct-h em{font-style:normal; font-family:var(--cond); font-size:20px; font-weight:700; color:var(--c)}
.ct-b{font-size:13.5px; color:var(--ink-2); margin:10px 0 4px}
.ct-list{display:grid; gap:6px; margin-top:10px}
.ct-m{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:4px 10px 4px 4px; cursor:pointer; color:var(--ink); font:inherit; text-decoration:none}
.ct-m:hover{border-color:var(--c)}
.ct-logo{width:60px; height:32px; border-radius:6px; background:#fff; display:grid; place-items:center; padding:3px 5px; border:1px solid var(--border)}
.ct-logo img{max-width:100%; max-height:100%; object-fit:contain}
.ct-logo img + i, .ct-logo.no img{display:none}
.ct-logo.no i{display:block}
.ct-logo i{font-style:normal; font-weight:700; font-size:12px; color:#0d314c}
.ct-n{font-weight:600; font-size:14px}
.ct-m > svg{width:16px; height:16px; color:var(--ink-3)}
.ct-list .ct-m.more, .ct-people .pro.more{display:none}
.ct-list.all .ct-m.more, .ct-people.all .pro.more{display:grid}
.ct-people.all .pro.more{display:flex}
.ct-all{margin-top:8px; width:100%; border:1px dashed var(--border-strong); background:none; border-radius:8px; padding:8px; font-weight:700; color:var(--link); cursor:pointer; font:inherit; font-weight:700}
.ct-about{display:inline-flex; align-items:center; gap:5px; margin-top:10px; font-size:13px; font-weight:600; color:var(--link); text-decoration:none}
.ct-about svg{width:13px; height:13px}
.ctile .search{margin-top:10px}
.ct-people{display:grid; gap:6px; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); margin-top:10px}

/* Speaker bio */
.bio-btn{margin:0 0 4px}
.bio{font-size:15.5px; line-height:1.6; margin-top:12px; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--sky); border-radius:10px; animation:bio-in .28s ease}
.bio p{margin:0 0 10px}
.bio p:last-child{margin:0}
@keyframes bio-in{from{opacity:0; transform:translateY(-6px)}}

/* Notes and banners */
.note{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--sky); border-radius:8px; padding:12px 14px; color:var(--ink-2); font-size:14px}
.note b{color:var(--ink)}
.overlap{color:var(--warn); font-size:12.5px; font-weight:600; margin:4px 0 0}
.install{display:none; align-items:center; gap:12px; background:var(--sel); border:1px solid var(--border-strong); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:14px}
.install.on{display:flex}
.install .x{margin-left:auto; background:none; border:0; cursor:pointer; color:var(--ink-2); padding:6px; display:grid; place-items:center}
.install img{width:36px; height:36px; border-radius:8px}
.foot{color:var(--ink-3); font-size:12px; margin-top:28px; text-align:center}

/* ---------- Tab bar (bottom in portrait, side rail in landscape) ---------- */
nav.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bar-bg); -webkit-backdrop-filter:saturate(1.6) blur(14px); backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); height:var(--tabbar-h)}
nav.tabbar button{background:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-3); font-size:11px; font-weight:600; position:relative; white-space:nowrap; padding:0 2px; min-width:0}
nav.tabbar button svg{width:24px; height:24px; transition:transform .2s}
nav.tabbar button[aria-current]{color:var(--ink)}
nav.tabbar button[aria-current] svg{transform:translateY(-1px); color:var(--navy-mid)}
:root[data-theme="dark"] nav.tabbar button[aria-current] svg{color:var(--sky)}
nav.tabbar button[aria-current]:before{content:""; position:absolute; top:0; left:24%; right:24%; height:3px; background:var(--sky); border-radius:0 0 2px 2px}
nav.tabbar .badge{position:absolute; top:7px; left:calc(50% + 6px); background:var(--star); color:#06202f; font-size:10px; font-weight:700; border-radius:9px; min-width:18px; height:18px; padding:0 5px; display:none; place-items:center; line-height:1}
nav.tabbar .badge.on{display:grid}

/* ---------- Sheets (detail panels) ---------- */
.sheet-back{position:fixed; inset:0; background:rgba(6,32,47,.5); z-index:40; opacity:0; transition:opacity .2s}
.sheet{position:fixed; z-index:41; left:0; right:0; bottom:0; top:calc(26px + env(safe-area-inset-top)); background:var(--ground); border-radius:14px 14px 0 0; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .26s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 34px rgba(6,32,47,.28); overflow:hidden}
.sheet.on{transform:none}
.sheet-back.on{opacity:1}
.sheet-head{display:flex; align-items:center; gap:8px; padding:12px 12px 10px; position:relative; z-index:2}
.sheet-head .grab{position:absolute; left:50%; top:5px; width:40px; height:4px; border-radius:2px; background:rgba(255,255,255,.5); transform:translateX(-50%)}
.sheet-head .title{font-weight:600; font-size:14px; color:rgba(255,255,255,.85); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sheet.plain .sheet-head{background:var(--surface); border-bottom:1px solid var(--border)}
.sheet.plain .sheet-head .title{color:var(--ink-2)}
.sheet.plain .sheet-head .grab{background:var(--border-strong)}
.iconbtn{border:1px solid var(--border); background:var(--surface); border-radius:7px; width:38px; height:38px; display:grid; place-items:center; cursor:pointer; color:var(--ink); flex:none}
.iconbtn svg{width:19px; height:19px}
.sheet-head .iconbtn.close{margin-left:auto}
.sheet:not(.plain) .sheet-head{position:absolute; left:0; right:0; top:0}
.sheet:not(.plain) .iconbtn{background:rgba(6,32,47,.35); border-color:rgba(255,255,255,.25); color:#fff}
.sheet-body{overflow-y:auto; overflow-x:hidden; flex:1; -webkit-overflow-scrolling:touch}
.sheet-pad{padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
.cover{color:#fff; padding:64px 18px 20px; background:var(--tagc, var(--navy)); position:relative; overflow:hidden}
.cover:before{content:""; position:absolute; inset:0; background:linear-gradient(160deg, rgba(6,32,47,.15), rgba(6,32,47,.7))}
.cover > *{position:relative; z-index:1}
.cover > .hero-art{position:absolute; z-index:0; opacity:.9}
.cover .k{display:inline-block; font-size:12.5px; font-weight:700; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); border-radius:4px; padding:3px 8px}
.cover h2{font-family:var(--cond); font-size:30px; line-height:1.05; margin-top:10px; letter-spacing:-.01em}
.cover .w{margin-top:12px; display:grid; gap:5px; color:rgba(255,255,255,.92); font-size:14.5px}
.cover .w div{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.cover .w svg{width:16px; height:16px; flex:none; opacity:.85}
.cover.person-cover{display:flex; gap:16px; align-items:flex-end}
.cover.person-cover img,.cover.person-cover .avatar{width:104px; height:104px; border-radius:12px; object-fit:cover; object-position:50% 22%; border:2px solid rgba(255,255,255,.4); font-size:34px; background:rgba(255,255,255,.12); color:#fff}
.d-actions{display:flex; gap:8px; flex-wrap:wrap}
.d-actions.two{display:grid; grid-template-columns:1fr 1fr; max-width:460px}
.d-actions.two .btn{min-width:0; padding:10px 8px; font-size:13.5px}
.btn.on-mine{--star-fill:currentColor}
.d-desc{margin-top:16px; font-size:15.5px; line-height:1.55}
.d-h{font-family:var(--cond); font-size:20px; font-weight:700; margin:24px 0 8px}
.ro{display:grid; gap:8px}
.ro-item{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; display:grid; grid-template-columns:70px 1fr; gap:10px}
.ro-item .tm{font-family:var(--cond); font-weight:700; font-size:17px; line-height:1.15}
.ro-item .tm span{display:block; font-family:"IBM Plex Sans",sans-serif; font-size:12px; font-weight:500; color:var(--ink-3)}
.ro-item .k{margin-bottom:4px}
.ro-item .tt{font-weight:600; line-height:1.3}
.ro-item .ds{color:var(--ink-2); font-size:14px; margin-top:4px}
.ro-item.brk{background:var(--surface-2); color:var(--ink-2)}
.ro-people{display:grid; gap:4px; margin-top:8px}
.pp{display:flex; gap:10px; align-items:center; border:0; background:none; padding:4px 0; cursor:pointer; text-align:left; width:100%}
.pp img,.pp .avatar{width:42px; height:42px; font-size:14px}
.pp .n{font-weight:600; font-size:14px}
.pp .r{color:var(--ink-2); font-size:12.5px; line-height:1.3}
.sp-card{display:flex; gap:14px; align-items:center; justify-content:center; background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; width:100%; min-height:72px}
.sp-card img{max-width:160px; max-height:50px; object-fit:contain}
.sp-card span{color:#0d314c; font-weight:600}
.big-logo{background:#fff; border-radius:10px; padding:22px; display:grid; place-items:center; min-height:150px}
.big-logo img{max-width:min(320px,100%); max-height:110px; object-fit:contain}

/* ---------- Loading screen ---------- */
#loading{position:fixed; inset:0; z-index:100; background:var(--navy-deep); display:grid; place-items:center; transition:opacity .35s}
#loading.done{opacity:0; pointer-events:none}
#loading .in{display:grid; gap:18px; justify-items:center}
#loading .lplate{padding:calc(min(300px, 62vmin) * .06) calc(min(300px, 62vmin) * .09); border-radius:6px}
#loading .lplate .wordmark{width:min(300px, 62vmin); height:auto}
#loading .in{position:relative}
#loading .bar{position:absolute; left:50%; top:calc(100% + 26px); transform:translateX(-50%)}
#loading .lbl{color:var(--sky-soft); font-weight:500; font-size:15px}
#loading .bar{width:160px; height:3px; background:rgba(116,191,235,.25); border-radius:2px; overflow:hidden}
#loading .bar i{display:block; height:100%; width:40%; background:var(--sky); animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
#loading .errtxt{color:#fff; max-width:320px; text-align:center; display:none; position:absolute; top:calc(100% + 20px); left:50%; transform:translateX(-50%); width:80vw}

/* ---------- Sizes and orientation ---------- */
@media (min-width:700px){
  .pass{grid-template-columns:1.35fr 1fr; align-items:end; padding:28px 26px 22px; column-gap:26px}
  .pass .flip{justify-content:flex-end; padding-bottom:0; flex-wrap:nowrap}
  .pass-figs{grid-column:auto; margin:12px 0 0}
  .rail{grid-auto-columns:minmax(260px, 32%)}
}
@media (min-width:900px){
  .sheet{left:auto; top:0; width:min(72vw, 880px); border-radius:0; transform:translateX(100%)}
  .sheet-head .grab{display:none}
}
@media (max-width:520px){
  .week{grid-template-columns:repeat(4,1fr); gap:6px}
  .wk{padding:8px 7px 10px}
  .wk .d b{font-size:24px}
  .appname{font-size:15px}
  .flip .tile{width:36px; height:50px; font-size:34px}
  .flip{gap:10px}
}
@media (max-width:440px){ .appname{display:none} .vrule{display:none} }
@media (max-width:420px){ body:not(.dash) .theme-btn{display:none} }
/* Landscape phones: the tab bar becomes a rail down the left so the screen keeps its height */
@media (orientation:landscape) and (max-height:540px){
  :root{--rail-w:calc(84px + env(safe-area-inset-left)); --tabbar-h:0px}
  body{padding-bottom:env(safe-area-inset-bottom)}
  nav.tabbar{top:0; right:auto; width:var(--rail-w); border-top:0; border-right:1px solid var(--border); padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left)}
  nav.tabbar .in{grid-template-columns:1fr; grid-auto-rows:1fr; height:100%; max-width:none}
  nav.tabbar button[aria-current]:before{top:22%; bottom:22%; left:auto; right:0; width:3px; height:auto; border-radius:2px 0 0 2px}
  .mast-in{padding-left:max(14px, env(safe-area-inset-left))}
  .pass{grid-template-columns:1.3fr 1fr; align-items:end; padding:18px 20px 20px; column-gap:18px}
  .pass .city{font-size:clamp(48px, 10vw, 96px)}
  .pass .flip{justify-content:flex-end; padding-bottom:0; flex-wrap:nowrap; gap:10px}
  .pass .flip .tile{width:clamp(30px, 3.6vw, 46px); height:clamp(42px, 5vw, 62px); font-size:clamp(28px, 3.4vw, 40px)}
  .pass-figs{grid-column:auto; margin:12px 0 0}
  .grid2{grid-template-columns:1fr 1fr}
  .rail{grid-auto-columns:minmax(250px, 46%)}
  .days{top:calc(50px + env(safe-area-inset-top))}
  .sheet{left:auto; top:0; width:min(78vw, 760px); border-radius:0; transform:translateX(100%)}
  .sheet-head .grab{display:none}
  .faces-grid{grid-template-columns:repeat(auto-fill, minmax(140px,1fr))}
}
@media (prefers-reduced-motion: reduce){ .sheet,.sheet-back{transition:none} #loading .bar i{animation:none} .flip .tile.go b,.star.pop svg{animation:none} }
</style>

  $('#sheets').appendChild(el);

  setTimeout(function () { var c = el.querySelector(opts.focus || '[data-sheet-close]'); if (c) c.focus({ preventScroll: true }); }, 80);

  if (!stack.length) { var back = $('#sheet-back'); back.classList.remove('on'); setTimeout(function () { if (!stack.length) back.hidden = true; }, 220); document.body.style.overflow = ''; }

/* A small live picture of a sponsor's home page, framed like a browser window. The picture comes from a public

  return '<a class="sitepeek" href="' + esc(url) + '" target="_blank" rel="noopener" aria-label="' + esc(shown) + '"><span class="pk-bar"><i></i><i></i><i></i><span class="pk-url">' + icon('i-lock') + esc(shown) + '</span></span>' +

function watchPeeks(root) {

/* ---------- attendees (relay request 13) ---------- */

  if (A.token && path !== 'code' && path !== 'verify' && path !== 'ready') headers.Authorization = 'Bearer ' + A.token;
  return fetch(RELAY + '/mymismo/att/' + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) {
      if (r.status === 401 && headers.Authorization) signOutLocal(true);
      return { status: r.status, ok: r.ok, j: j };
    }); })
    .catch(function () { return { status: 0, ok: false, j: { message: navigator.onLine === false ? 'You\'re offline. Try again once you\'re connected.' : 'MyMISMO couldn\'t reach MISMO just now. Try again in a minute.' } }; });
}
/* Headshots (relay request 15): only signed-in attendees can load them, so they come through the relay one at a time,
   as each person scrolls into view, and are kept in memory for the session. */
var PHOTOS = {}, PHOTO_WAIT = [], PHOTO_BUSY = 0;
function avatarHtml(p, cls) {
  var k = p.id + ':' + p.photo, src = p.photo ? PHOTOS[k] : '';
  return src ? '<img class="avatar ' + (cls || '') + '" src="' + esc(src) + '" alt="">' :
    '<span class="avatar ' + (cls || 'c') + '"' + (p.photo ? ' data-photo="' + esc(p.id) + '" data-pv="' + p.photo + '"' : '') + '>' + esc(initials(p.name)) + '</span>';
}
function photoPump() {

    var el = PHOTO_WAIT.shift(), id = el.getAttribute('data-photo'), v = el.getAttribute('data-pv'), k = id + ':' + v;
    if (PHOTOS[k]) { swapPhoto(el, PHOTOS[k]); continue; }
    PHOTO_BUSY++;
    (function (el, k) {
      rq('GET', 'photo?id=' + encodeURIComponent(id)).then(function (r) {
        PHOTO_BUSY--; if (r.ok && r.j.s) { PHOTOS[k] = r.j.s; $$('[data-photo="' + k.split(':')[0] + '"]').forEach(function (e) { swapPhoto(e, r.j.s); }); }
        photoPump();
      });
    })(el, k);
  }
}
function swapPhoto(el, src) { var img = document.createElement('img'); img.className = el.className; img.src = src; img.alt = ''; el.replaceWith(img); }
var photoSeen = 'IntersectionObserver' in window ? new IntersectionObserver(function (es) {
  es.forEach(function (e) { if (e.isIntersecting) { photoSeen.unobserve(e.target); PHOTO_WAIT.push(e.target); } }); photoPump();
}, { rootMargin: '200px' }) : null;

/* shrink a picked photo to a 320-pixel square JPEG on the phone before it's sent */
function squarePhoto(file) {
  return new Promise(function (ok, no) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var n = Math.min(img.naturalWidth, img.naturalHeight), c = document.createElement('canvas'); c.width = c.height = 320;
      var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 320, 320);
      x.drawImage(img, (img.naturalWidth - n) / 2, Math.max(0, (img.naturalHeight - n) / 3), n, n, 0, 0, 320, 320);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); no(); };
    img.src = url;
  });
}
/* ---------- Alerts (relay request 14) ---------- */

function rp(method, path, body) {

    .catch(function () { return { ok: false, status: 0, j: {} }; });

function pushSupported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }

    em.textContent = parts > 1 ? 'Downloading ' + Math.round(k / parts * 100) + '%' : 'Downloading…';
    return rq('GET', 'slide?session=' + encodeURIComponent(id) + '&n=' + n + '&part=' + k).then(function (r) {
      if (!r.ok) throw new Error('part');

/* ---------- calendar files ---------- */
function icsDate(iso, m) { return iso.replace(/-/g, '') + 'T' + ('0' + Math.floor(m / 60)).slice(-2) + ('0' + (m % 60)).slice(-2) + '00'; }
function icsText(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function fold(line) { var out = '', i = 0; while (line.length - i > 74) { out += line.slice(i, i + 74) + '\r\n '; i += 74; } return out + line.slice(i); }
function ics(list) {
  var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z'), tz = S.zone ? ';TZID=' + S.zone : '';
  var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MISMO//MyMISMO//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  list.forEach(function (x) {
    lines.push('BEGIN:VEVENT', 'UID:' + slug(S.sid + '-' + x.id) + '@resources.mismo.org', 'DTSTAMP:' + stamp,
      'DTSTART' + tz + ':' + icsDate(x.date, x.a), 'DTEND' + tz + ':' + icsDate(x.date, x.b == null ? x.a + 60 : x.b),
      fold('SUMMARY:' + icsText(x.title)), fold('LOCATION:' + icsText([x.room, S.summit.city].filter(Boolean).join(', '))),
      fold('DESCRIPTION:' + icsText([S.summit.name, x.type, x.desc].filter(Boolean).join('\n'))),
      'BEGIN:VALARM', 'TRIGGER:-PT15M', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsText(x.title), 'END:VALARM', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' }));
  a.download = (list.length === 1 ? slug(list[0].title) : 'my-' + slug(S.summit.name) + '-schedule') + '.ics';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
