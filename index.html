<style>
:root{
  --navy:#0d314c; --sky:#74bfeb; --navy-deep:#06202f; --navy-mid:#14486e; --sky-soft:#a9d8f3; --sky-wash:#e4f2fb;
  --ground:#f1f6fa; --surface:#ffffff; --surface-2:#f6fafd; --surface-3:#e9f1f8;
  --border:#d5e2ed; --border-strong:#adc4d6; --rule:#e5eef5;
  --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
  --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a;
  --link:#14486e; --accent-fill:#0d314c; --accent-ink:#ffffff; --star:#d99a00; --sel:#e4f2fb;
  --c1:#2477b8; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --shadow:0 1px 2px rgba(13,49,76,.06), 0 6px 18px rgba(13,49,76,.07);
  --bar-bg:rgba(255,255,255,.86);
  --tabbar-h:66px; --rail-w:0px;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
    --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
    --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
    --good:#4fc79b; --bad:#f08579; --warn:#e0a83c;
    --link:#74bfeb; --accent-fill:#74bfeb; --accent-ink:#06202f; --star:#f0b93a; --sel:#173c52;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9e2f;
    --shadow:none; --bar-bg:rgba(13,40,55,.88);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
  --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
  --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
  --good:#4fc79b; --bad:#f08579; --warn:#e0a83c;
  --link:#74bfeb; --accent-fill:#74bfeb; --accent-ink:#06202f; --star:#f0b93a; --sel:#173c52;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9e2f;
  --shadow:none; --bar-bg:rgba(13,40,55,.88);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--ground); color:var(--ink); font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-left:var(--rail-w)}
button{font-family:inherit; font-size:inherit; color:inherit}
a{color:var(--link)}
h1,h2,h3{letter-spacing:-.012em; margin:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--sky); outline-offset:2px}

/* ---------- Masthead ---------- */
.mast{position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; padding-top:env(safe-area-inset-top)}
.mast-in{display:flex; align-items:center; gap:10px; padding:9px 14px; max-width:1240px; margin:0 auto}
.lplate{position:relative; background:#fff; border:0; border-radius:5px; padding:7px 10px; display:flex; align-items:center; line-height:0; font:inherit; cursor:pointer; transition:transform .15s ease}
body.dash .lplate{cursor:default}
body:not(.dash) .lplate:active{transform:scale(.95)}
.lplate .wordmark{height:19px; width:auto}
.lplate .santa{position:absolute; display:none; pointer-events:none; left:-9px; top:-12px; width:28px; height:28px}
html[data-season="december"] .lplate .santa{display:block}
html[data-season="december"] .mast-in{padding-top:16px}
.vrule{width:1px; align-self:stretch; background:rgba(116,191,235,.4)}
.appname{color:var(--sky-soft); font-weight:500; font-size:16px; white-space:nowrap}
.mast-right{margin-left:auto; display:flex; align-items:center; gap:6px}
.theme-btn{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:5px; padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:inherit; white-space:nowrap}
.theme-btn:hover{background:rgba(255,255,255,.18)}
.mast-icon{position:relative; width:40px; height:40px; display:grid; place-items:center; border-radius:4px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:#fff; cursor:pointer}
.mast-icon svg{width:20px; height:20px}
.theme-btn[hidden]{display:none !important}   /* dark mode lives in Settings */
.mast-icon .ini-chip{font-size:12px; font-weight:700; letter-spacing:.02em}
.mast-icon .dot{position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--star); color:#06202f; font-size:10.5px; font-weight:700; display:none; place-items:center}
.mast-icon .dot.on{display:grid}

/* ---------- Pages ---------- */
main{max-width:1240px; margin:0 auto; padding:14px 14px 28px; overflow-x:clip}
.page{display:none}
.page.on{display:block}
.pagehead{display:flex; align-items:baseline; gap:12px; margin:6px 0 12px; flex-wrap:wrap}
.pagehead h1{font-family:var(--cond); font-size:30px; font-weight:700; letter-spacing:-.01em; line-height:1}
.pagehead .sub{color:var(--ink-2); font-size:14px}
.section-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:26px 0 10px}
.section-h h2{font-family:var(--cond); font-size:22px; font-weight:700; letter-spacing:-.005em}
.linkbtn{background:none; border:0; padding:0; color:var(--link); font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; min-width:max-content}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
  border-radius:6px; padding:10px 14px; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; min-width:max-content; text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent-fill); color:var(--accent-ink); border-color:var(--accent-fill)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn:disabled{opacity:.55; cursor:default}
.btn svg{width:17px; height:17px; flex:none}
.tag{display:inline-block; border-radius:3px; padding:2px 7px; font-size:11.5px; font-weight:600; letter-spacing:.01em; white-space:nowrap;
  background:var(--surface-3); color:var(--ink-2); border-left:3px solid var(--tagc, var(--border-strong))}

/* ---------- The Summit Pass (home hero) ---------- */
.pass{position:relative; overflow:hidden; border-radius:14px; color:#fff; background:var(--navy-deep);
  padding:22px 20px 18px; isolation:isolate; display:grid; gap:18px}
.pass:before{content:""; position:absolute; inset:0; z-index:-2;
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(116,191,235,.30), rgba(116,191,235,0) 55%),
    radial-gradient(90% 70% at 0% 100%, rgba(20,72,110,.9), rgba(20,72,110,0) 70%),
    linear-gradient(160deg, #0d314c 0%, #06202f 70%)}
.pass:after{content:""; position:absolute; inset:0; z-index:-1; opacity:.16;
  background-image:linear-gradient(rgba(116,191,235,.55) 1px, transparent 1px), linear-gradient(90deg, rgba(116,191,235,.55) 1px, transparent 1px);
  background-size:28px 28px; mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 60%, transparent 100%); -webkit-mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 60%, transparent 100%)}
.pass .summit{font-weight:600; color:var(--sky-soft); font-size:15px}
.pass .city{font-family:var(--cond); font-weight:700; font-size:clamp(54px, 15.5vw, 132px); line-height:.86; letter-spacing:-.025em; margin:4px 0 0 -3px; color:#fff; text-wrap:balance}
.pass .when{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:12px; color:rgba(255,255,255,.88); font-size:14.5px}
.pass .when span{display:inline-flex; align-items:center; gap:7px; white-space:nowrap}
.pass .when svg{width:16px; height:16px; color:var(--sky)}
.flip{display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap}
.flip .unit{display:grid; gap:6px; justify-items:start}
.flip .tiles{display:flex; gap:4px}
.flip .tile{position:relative; width:46px; height:62px; border-radius:7px; background:linear-gradient(180deg, #14486e 0 50%, #103d5e 50% 100%);
  border:1px solid rgba(116,191,235,.35); display:grid; place-items:center; font-family:var(--cond); font-weight:700; font-size:44px; color:#fff; overflow:hidden;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.flip .tile:after{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(6,32,47,.7)}
.flip .tile b{display:block; transform-origin:50% 50%}
.flip .tile.go b{animation:flipin .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flipin{0%{transform:rotateX(90deg); opacity:.2}100%{transform:none; opacity:1}}
.flip .lbl{font-size:12.5px; font-weight:600; color:var(--sky-soft)}
.flip .state{font-family:var(--cond); font-size:40px; font-weight:700; line-height:1; color:#fff}
.flip .state small{font-size:18px; color:var(--sky-soft); font-weight:600; margin-left:6px}
.pass-figs{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0 0}
.pass-figs button{position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; gap:3px; background:linear-gradient(180deg, #123d61, #0b2a44); border:1px solid rgba(116,191,235,.28); border-radius:14px; color:#fff; padding:12px 4px 12px; cursor:pointer; text-align:center; font:inherit; box-shadow:inset 0 1px 0 rgba(255,255,255,.06); transition:border-color .15s, transform .15s}
.pass-figs button:after{content:""; position:absolute; left:18%; right:18%; top:0; height:2px; background:linear-gradient(90deg, transparent, #74bfeb, transparent); opacity:.8}
.pass-figs button:hover{border-color:rgba(116,191,235,.7); transform:translateY(-1px)}
.pass-figs svg{width:20px; height:20px; color:#74bfeb; margin-bottom:2px}
.pass-figs b{display:block; font-family:var(--cond); font-size:28px; line-height:1.05; color:#fff}
.pass-figs span{font-size:12px; color:#a9d8f3; font-weight:600}

/* Your week: each day's sessions by type */
.week{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.wk{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 10px 12px; text-align:left; cursor:pointer; box-shadow:var(--shadow); display:grid; gap:8px}
.wk:hover{border-color:var(--border-strong)}
.wk .d{display:flex; align-items:baseline; gap:6px}
.wk .d b{font-family:var(--cond); font-size:28px; line-height:1}
.wk .d span{color:var(--ink-2); font-size:13px; font-weight:600}
.wk .stack{display:flex; flex-direction:column-reverse; gap:2px; height:64px; justify-content:flex-start}
.wk .stack i{display:block; border-radius:2px; background:var(--tagc)}
.wk .n{font-size:12.5px; color:var(--ink-2)}
.wk.today{border-color:var(--sky); box-shadow:0 0 0 2px var(--sky)}

/* On now rail */
.rail{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px, 78%); gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail.one{grid-auto-columns:100%}
.nowcard{scroll-snap-align:start; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:left; cursor:pointer; display:grid; gap:6px; box-shadow:var(--shadow); border-top:4px solid var(--tagc)}
.nowcard .t{font-weight:600; line-height:1.3}
.nowcard .m{color:var(--ink-2); font-size:13px}
.prog{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden}
.prog i{display:block; height:100%; background:var(--good)}

/* Session cards */
.list{display:grid; gap:8px}
.grid2{display:grid; gap:8px; grid-template-columns:1fr}
@media (min-width:760px){ .grid2{grid-template-columns:1fr 1fr} }
.slot{display:grid; grid-template-columns:54px 1fr; gap:10px; margin-top:12px}
.slot .tm{font-family:var(--cond); font-weight:700; font-size:18px; line-height:1.1; color:var(--ink); padding-top:10px; position:relative}
.slot .tm small{display:block; font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; font-weight:600; color:var(--ink-3)}
.slot.now .tm{color:var(--good)}
.slot.now .tm small{color:var(--good)}
.sess{display:grid; grid-template-columns:4px 1fr auto; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); width:100%}
.sess:hover{border-color:var(--border-strong)}
.sess .bar{background:var(--tagc, var(--border-strong))}
.sess .body{padding:11px 12px; min-width:0; border:0; background:none; text-align:left; cursor:pointer; color:inherit}
.sess .t{font-weight:600; font-size:15px; line-height:1.3}
.sess .m{color:var(--ink-2); font-size:13px; margin-top:4px; display:flex; flex-wrap:wrap; gap:4px 12px}
.sess .m span{display:inline-flex; gap:5px; align-items:center; white-space:nowrap}
.sess .m svg{width:14px; height:14px; color:var(--ink-3)}
.sess .extra{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.sess .spons{font-size:12.5px; color:var(--ink-2)}
.sess .spons b{color:var(--ink); font-weight:600}
.spline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex-basis:100%}
.spchips{display:inline-flex; gap:6px; flex-wrap:wrap}
.spchip{display:inline-grid; place-items:center; background:#fff; border:1px solid var(--border); border-radius:5px; height:30px; padding:3px 8px; min-width:52px}
.spchip img{max-height:22px; max-width:96px; object-fit:contain; display:block}
.spchip b{font-size:12px; color:#0d314c}
.cover .spline{margin-top:14px}
.cover .spons{color:rgba(255,255,255,.85); font-size:13px; font-weight:600}
.cover .spchip{height:36px; border-color:transparent}
.cover .spchip img{max-height:26px; max-width:120px}
.sess.live{border-color:var(--good); box-shadow:0 0 0 1px var(--good)}
.livetag{background:var(--good); color:#fff; border-radius:3px; padding:2px 6px; font-size:11px; font-weight:700; letter-spacing:.03em}
.star{align-self:center; margin-right:6px; width:42px; height:42px; border-radius:50%; border:0; background:transparent; cursor:pointer; display:grid; place-items:center; color:var(--ink-3)}
.star:hover{background:var(--surface-3)}
.star svg{width:23px; height:23px}
.star[aria-pressed="true"]{color:var(--star); --star-fill:currentColor}
.star.pop svg{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:none}}
.faces{display:flex}
.faces img,.faces .ini{width:28px; height:28px; border-radius:50%; border:2px solid var(--surface); margin-left:-7px; object-fit:cover; background:var(--surface-3)}
.faces > :first-child{margin-left:0}
.ini{display:grid; place-items:center; font-size:10.5px; font-weight:700; color:var(--ink-2)}

/* Feature card (General Sessions) */
.feature{display:grid; grid-template-columns:1fr; background:var(--navy); color:#fff; border-radius:12px; overflow:hidden; cursor:pointer; border:0; text-align:left; padding:0; width:100%}
.feature .ph{display:grid; grid-template-columns:repeat(6,1fr); height:110px}
.feature .ph img,.feature .ph span{width:100%; height:100%; object-fit:cover; object-position:50% 25%; display:block; background:#14486e}
.feature .ph span{display:grid; place-items:center; color:var(--sky-soft); font-weight:700}
.feature .tx{padding:14px 16px 16px}
.feature .tx b{font-family:var(--cond); font-size:24px; display:block; line-height:1.1}
.feature .tx div{color:var(--sky-soft); margin-top:4px; font-size:14px}

/* Day switcher and filters */
.days{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; position:sticky; top:calc(54px + env(safe-area-inset-top)); z-index:5; background:var(--ground); padding:6px 0 8px}
html[data-season="december"] .days{top:calc(61px + env(safe-area-inset-top))}
.day{border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:6px 4px 7px; cursor:pointer; text-align:center; line-height:1.05; display:grid; gap:2px}
.day b{font-family:var(--cond); font-size:26px}
.day span{font-size:12px; color:var(--ink-2); font-weight:600}
.day[aria-pressed="true"]{background:var(--accent-fill); border-color:var(--accent-fill); color:var(--accent-ink)}
.day[aria-pressed="true"] span{color:inherit; opacity:.85}
.tools{display:flex; gap:8px; margin:6px 0 4px; flex-wrap:wrap}
.search{flex:1 1 220px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0 10px}
.search svg{width:17px; height:17px; color:var(--ink-3); flex:none}
.search input{border:0; outline:0; background:transparent; color:var(--ink); font:inherit; padding:10px 0; width:100%}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border); background:var(--surface); border-radius:5px; padding:6px 10px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px}
.chip i{width:9px; height:9px; border-radius:2px; background:var(--tagc, var(--border-strong)); display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--accent-fill); background:var(--sel); font-weight:600}
.seg{display:inline-grid; grid-auto-flow:column; max-width:100%; border:1px solid var(--border-strong); border-radius:7px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; margin-bottom:10px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0; background:var(--surface); padding:8px 16px; font-weight:600; cursor:pointer; white-space:nowrap; border-right:1px solid var(--border-strong)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-fill); color:var(--accent-ink)}

/* Speakers: photo cards */
.faces-grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(158px,1fr))}
.pcard{position:relative; border:0; padding:0; border-radius:12px; overflow:hidden; cursor:pointer; aspect-ratio:4/5; background:var(--navy); text-align:left; color:#fff}
.pcard img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 22%}
.pcard .noimg{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--cond); font-size:56px; font-weight:700; color:var(--sky);
  background:radial-gradient(80% 60% at 70% 20%, rgba(116,191,235,.25), transparent), linear-gradient(160deg,#14486e,#06202f)}
.pcard .cap{position:absolute; left:0; right:0; bottom:0; padding:40px 12px 11px; background:linear-gradient(180deg, rgba(6,32,47,0), rgba(6,32,47,.92) 55%)}
.pcard .cap b{display:block; font-size:15.5px; line-height:1.2}
.pcard .cap span{display:block; font-size:12.5px; color:var(--sky-soft); line-height:1.3; margin-top:2px}

/* Attendees */
.people{display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(270px,1fr))}
.person{display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; text-align:left; box-shadow:var(--shadow); width:100%}
.person:hover{border-color:var(--border-strong)}
.avatar{width:52px; height:52px; border-radius:50%; object-fit:cover; flex:none; background:var(--surface-3); display:grid; place-items:center; font-weight:700; color:var(--ink-2); font-size:17px}
.avatar.c{color:#fff; background:linear-gradient(150deg, var(--navy-mid), var(--navy))}
.person .n{font-weight:600}
.person .r{color:var(--ink-2); font-size:13px; line-height:1.35}
.join{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; background:var(--navy); color:#fff; border-radius:12px; padding:16px}
.join svg{width:40px; height:40px; color:var(--sky)}
.join b{font-family:var(--cond); font-size:22px; display:block; line-height:1.1}
.join p{margin:4px 0 10px; color:var(--sky-soft)}
.join .btn.primary{background:var(--sky); border-color:var(--sky); color:#06202f}

/* Messages */
.thread{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; width:100%; text-align:left}
.thread .last{color:var(--ink-2); font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.thread .when{color:var(--ink-3); font-size:12px; white-space:nowrap}
.thread.unread{border-color:var(--sky); box-shadow:0 0 0 1px var(--sky)}
.thread.unread .n:after{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--sky); margin-left:7px; vertical-align:2px}
.chat{display:flex; flex-direction:column; gap:6px; padding-bottom:8px}
.bub{max-width:82%; padding:9px 12px; border-radius:12px; font-size:15px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word}
.bub.them{align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px}
.bub.me{align-self:flex-end; background:var(--navy-mid); color:#fff; border-bottom-right-radius:4px}
.bub small{display:block; font-size:11px; opacity:.7; margin-top:3px}
.compose{position:sticky; bottom:0; display:grid; grid-template-columns:1fr auto; gap:8px; padding:10px 0 4px; background:var(--ground)}
.compose textarea{resize:none; min-height:44px; max-height:140px; border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; font:inherit; color:var(--ink); background:var(--surface)}

/* Forms */
.field{display:grid; gap:5px; margin-bottom:12px}
.field label{font-weight:600; font-size:13.5px}
.field input,.field textarea{border:1px solid var(--border-strong); border-radius:7px; padding:10px 12px; font:inherit; color:var(--ink); background:var(--surface); width:100%}
.field .hint{color:var(--ink-3); font-size:12.5px}
.codebox{font-family:var(--cond); font-size:34px; letter-spacing:.35em; text-align:center; font-weight:700; padding:10px 0 10px .35em !important}
.toggle{display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; margin-bottom:12px}
.toggle input{width:20px; height:20px; margin:2px 0 0; accent-color:var(--navy-mid); flex:none}
.toggle b{display:block; color:var(--ink)}
.toggle span{color:var(--ink-2); font-size:13.5px}
.err{color:var(--bad); font-weight:600; font-size:14px; margin:6px 0}
.okmsg{color:var(--good); font-weight:600; font-size:14px; margin:6px 0}

/* Sponsors */
.tier{margin-top:18px}
.tier h2{font-family:var(--cond); font-size:20px; font-weight:700; color:var(--ink); margin-bottom:8px; display:flex; align-items:center; gap:8px}
.tier h2 i{width:12px; height:12px; border-radius:2px; background:var(--tierc)}
.logos{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(150px,1fr))}
.tier.big .logos{grid-template-columns:repeat(auto-fit, minmax(220px,1fr))}
.logo{background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; display:grid; place-items:center; min-height:96px; width:100%}
.tier.big .logo{min-height:124px}
.logo img{max-width:100%; max-height:58px; margin:auto; object-fit:contain; display:block}
.tier.big .logo img{max-height:76px}
.logo .nologo{font-size:15px; font-weight:600; color:#0d314c; text-align:center}
.strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:8px}
.strip .logo{min-height:76px}
.strip .logo img{max-height:44px}


/* ---------- Feels like an app ---------- */
html{-webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,a,.wd,.plc,.spc{touch-action:manipulation}
.wd,.plc,.spc,.ch-opt,.tile,.sess .body,.btn,.livecard,.poster{transition:transform .14s ease, box-shadow .2s, background .2s}
.wd:active,.plc:active,.spc:active,.ch-opt:active,.btn:active,.livecard:active,.poster:active{transform:scale(.975)}
.btn.small{padding:7px 11px; font-size:13px}
.btn.big{padding:14px 20px; font-size:16px; width:100%}
.count{font-family:var(--cond); font-weight:700; font-size:15px; color:var(--ink-3)}
.lede{font-size:15.5px; color:var(--ink-2); margin:0 0 14px}

/* ---------- Masthead: the S goes back to the dashboard ---------- */
.smark{position:relative; display:none; width:40px; height:40px; border-radius:9px; border:0; background:#fff; place-items:center; cursor:pointer; padding:0; flex:none; box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.smark svg:first-child{width:34px; height:34px; color:#50a4db}
.smark .santa{position:absolute; display:none; pointer-events:none; left:-10px; top:-13px; width:28px; height:28px}
html[data-season="december"] .smark .santa{display:block}
body.dash nav.tabbar{display:none}
body.dash{padding-left:0; padding-bottom:env(safe-area-inset-bottom)}

/* ---------- The website's hero art, animated ---------- */
.hero-art{position:absolute; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none}
.ha-win rect{opacity:.25; animation:ha-tw 5.5s ease-in-out infinite}
.ha-glow{transform-box:fill-box; transform-origin:center; animation:ha-drift 16s ease-in-out infinite alternate}
.ha-run path{stroke-dasharray:90 1400; stroke-dashoffset:90; opacity:.9; animation:ha-run 6.5s cubic-bezier(.45,.05,.4,1) infinite}
.art-fade{position:absolute; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(90deg, rgba(7,29,46,.92) 0%, rgba(7,29,46,.72) 38%, rgba(7,29,46,.25) 66%, rgba(7,29,46,0) 82%)}
.pass > span.art-fade{position:absolute; z-index:0; background:linear-gradient(180deg, rgba(7,29,46,.35) 0%, rgba(7,29,46,.2) 30%, rgba(7,29,46,.62) 62%, rgba(7,29,46,.9) 100%)}
.pass > .nola{opacity:.9}
.nola .no-stars circle{animation:no-twinkle 4s ease-in-out infinite}
.nola .no-halo{transform-box:fill-box; transform-origin:center; animation:no-halo 6s ease-in-out infinite}
.nola .no-flag{animation:no-sway 4.5s ease-in-out infinite}
.nola .no-lamp{transform-box:fill-box; transform-origin:center; animation:no-flicker 3.2s ease-in-out infinite}
.nola .no-door,.nola .no-clock{animation:no-door 7s ease-in-out infinite}
.nola .no-car{animation:no-car 24s linear infinite}
@keyframes no-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes no-halo{0%,100%{opacity:.8; transform:scale(1)}50%{opacity:1; transform:scale(1.06)}}
@keyframes no-sway{0%,100%{transform:skewY(0) rotate(0)}50%{transform:skewY(-3deg) rotate(2deg)}}
@keyframes no-flicker{0%,100%{opacity:.85; transform:scale(1)}20%{opacity:.6}40%{opacity:.95; transform:scale(1.08)}60%{opacity:.75}}
@keyframes no-door{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes no-car{0%{transform:translate(380px,478px)}100%{transform:translate(1260px,478px)}}
.nola .no-clock{animation:no-door 5s ease-in-out infinite}
@keyframes ha-tw{0%,100%{opacity:.2}45%{opacity:.95}}
@keyframes ha-drift{to{transform:translate(-80px,30px) scale(1.12)}}
@keyframes ha-run{0%{stroke-dashoffset:90; opacity:0}8%{opacity:.95}70%{opacity:.8}100%{stroke-dashoffset:-1000; opacity:0}}
.pass{background:#071d2e}
.pass:before,.pass:after{display:none}
.pass > :not(.hero-art){position:relative}
.pass > .hero-art{z-index:0}
.pass{isolation:isolate}
.pass:has(.hero-art) .flip, .pass:has(.hero-art) > div{z-index:1}

/* ---------- Summit welcome (Home) ---------- */
.welcome{margin-top:22px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
.wl-head{padding:20px 20px 18px; background:linear-gradient(135deg, var(--sky-wash, #e4f2fb), var(--surface) 70%); border-bottom:1px solid var(--border)}
:root[data-theme="dark"] .wl-head{background:linear-gradient(135deg, #14486e, var(--surface) 70%)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .wl-head{background:linear-gradient(135deg, #14486e, var(--surface) 70%)} }
.wl-eye{display:flex; align-items:center; gap:6px; color:var(--link); font-weight:700; font-size:13.5px; margin-bottom:8px}
.wl-eye svg{width:15px; height:15px; color:var(--star)}
.wl-title{font-family:var(--cond); font-size:clamp(30px, 8vw, 48px); line-height:1; letter-spacing:-.02em; color:var(--ink); text-wrap:balance}
.wl-sub{margin:10px 0 0; font-size:clamp(17px, 4.4vw, 22px); font-weight:600; color:var(--link)}
.wl-body{padding:16px 20px 14px}
.wl-body p{margin:0 0 10px; font-size:15.5px; line-height:1.6}
.wl-lede{font-size:16.5px !important}
.wl-glance{display:grid; gap:10px; margin-top:12px}
@media (min-width:640px){ .wl-glance{grid-template-columns:repeat(auto-fit, minmax(240px,1fr))} }
.wl-g{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--border); border-left:5px solid var(--wc); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); animation:tile-in .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 80ms)}
.wl-cal{display:flex; gap:5px}
.wl-cal .cal{display:grid; flex:none; width:46px; border-radius:8px; overflow:hidden; background:var(--surface); border:1px solid var(--border); text-align:center; box-shadow:0 2px 6px -3px rgba(6,32,47,.35)}
.wl-cal .cal i{font-style:normal; font-size:10.5px; font-weight:700; color:#fff; background:var(--wc); padding:2px 0}
.wl-cal .cal b{font-family:var(--cond); font-size:22px; line-height:1.25; color:var(--ink)}
.wl-cal .cal.wide{width:auto; padding:6px 10px}
.wl-g.multi{grid-template-columns:1fr; gap:10px}
.wl-gtx b{display:block; font-family:var(--cond); font-size:18px}
.wl-gtx span{color:var(--ink-2); font-size:14px; line-height:1.4}
.wl-cta{position:relative; overflow:hidden; isolation:isolate; margin-top:12px; border-radius:16px; background:#071d2e; color:#fff}
.wl-cta > .hero-art{z-index:-1; opacity:.85}
.wl-cta-in{padding:22px 20px 20px}
.wl-closer{font-family:var(--cond); font-weight:700; font-size:clamp(24px, 6.6vw, 32px); line-height:1.08; margin:0 0 16px; color:#fff; max-width:18ch}
.wl-btns{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.wl-btns .btn{justify-content:center; margin:0}
.wl-reg{grid-column:1 / -1; background:var(--sky); border-color:var(--sky); color:#06202f; font-weight:700}
.wl-ghost{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.35); color:#fff}
@media (min-width:640px){ .wl-btns{grid-template-columns:repeat(3, max-content)} .wl-reg{grid-column:auto} .wl-btns .btn{padding-left:20px; padding-right:20px} }

/* ---------- My Dashboard ---------- */
.w-new{display:block; margin-top:6px; font-size:12.5px; color:var(--ink-2)}
.w-new b{color:var(--good); font-weight:700}
.dash-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:8px 0 16px}
.dh-date{color:var(--ink-2); font-weight:600; font-size:13.5px}
.dash-head h1{font-family:var(--cond); font-size:clamp(32px, 9vw, 44px); line-height:1; letter-spacing:-.02em; margin-top:3px}
.dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; grid-auto-flow:dense}
.wd{position:relative; overflow:hidden; isolation:isolate; display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; border-radius:18px; padding:16px; min-height:150px; cursor:pointer; text-decoration:none;
  background:var(--surface); border:1px solid var(--border); color:var(--ink); box-shadow:var(--shadow); font:inherit}
.wd.wide{grid-column:1 / -1}
.w-head{display:flex; align-items:center; gap:7px; font-weight:700; font-size:13px; color:var(--ink-2); width:100%}
.w-head svg{width:18px; height:18px; color:var(--link); flex:none}
.w-head .go{margin-left:auto; width:18px; height:18px; opacity:.7}
.w-t{font-family:var(--cond); font-size:20px; font-weight:700; line-height:1.12; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden}
.w-sub{color:var(--ink-2); font-size:13px; line-height:1.35; margin-top:auto}
.w-summit{min-height:230px; background:#071d2e; border:0; color:#fff}
.w-summit .w-head{color:var(--sky-soft)}
.w-summit .w-head svg{color:var(--sky); width:22px; height:22px}
.w-summit .w-head svg.go{width:18px; height:18px; margin:0 0 0 auto}
.w-city{font-family:var(--cond); font-weight:700; font-size:clamp(46px, 14vw, 84px); line-height:.86; letter-spacing:-.025em; margin-top:10px}
.w-name{color:rgba(255,255,255,.82); font-weight:600; font-size:14px}
.w-count{display:flex; align-items:baseline; gap:8px; margin-top:auto}
.w-count b{font-family:var(--cond); font-size:40px; line-height:1; color:var(--sky)}
.w-count i{font-style:normal; font-weight:600; color:#fff}
.w-summit .w-sub{color:rgba(255,255,255,.75); margin-top:0}
.w-mic{min-height:200px; background:#06202f; border:0; color:#fff; justify-content:flex-end}
.w-mic .bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:-2; transform:scale(1.02)}
.w-mic .shade{position:absolute; inset:0; z-index:-1; background:linear-gradient(180deg, rgba(6,32,47,.55), rgba(6,32,47,.1) 35%, rgba(6,32,47,.92))}

/* ---------- Explore ---------- */
.postcard{position:relative; overflow:hidden; isolation:isolate; border-radius:20px; color:#fff; background:#071d2e; min-height:360px; display:flex; flex-direction:column; justify-content:flex-end}

.pc-city{position:absolute; top:6px; left:12px; right:0; font-family:var(--cond); font-weight:700; font-size:clamp(64px, 21vw, 170px); line-height:.82; letter-spacing:-.04em; color:transparent; -webkit-text-stroke:1.5px rgba(116,191,235,.45); white-space:nowrap; overflow:hidden; animation:city-in 1.1s cubic-bezier(.2,.8,.2,1) both}

.pc-body{position:relative; padding:150px 20px 20px}
.pc-eye{display:inline-flex; gap:7px; align-items:center; font-weight:700; font-size:13px; color:var(--sky-soft)}

.postcard .when svg{width:16px; height:16px; color:var(--sky)}
.block{display:grid; grid-template-columns:64px auto 1fr; gap:12px; align-items:center; margin:16px 0; padding:12px; border-radius:14px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px)}
.ring{width:64px; height:64px; transform:rotate(-90deg); grid-column:1; grid-row:1}
.ring circle{fill:none; stroke-width:6}
.ring .tr{stroke:rgba(255,255,255,.14)}
.ring .fg{stroke:var(--sky); stroke-linecap:round; animation:ring-in 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring-in{from{stroke-dashoffset:164}}
.bk-n{grid-column:1; grid-row:1; text-align:center; line-height:1}
.bk-n b{display:block; font-family:var(--cond); font-size:22px}
.bk-n span{font-size:10.5px; font-weight:600; color:var(--sky-soft)}
.bk-tx{grid-column:2 / -1; font-size:14px; color:rgba(255,255,255,.88)}
.bk-tx b{color:#fff}
.postcard .d-actions{margin-top:18px}
.postcard .btn.ghost{background:rgba(7,29,46,.78); border-color:rgba(116,191,235,.7); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.block.solo{margin:14px 0 0; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--sky); -webkit-backdrop-filter:none; backdrop-filter:none; color:var(--ink)}
.block.solo .ring .tr{stroke:var(--surface-3)}
.block.solo .ring .fg{stroke:#2477b8}
.block.solo .bk-n b{color:var(--ink)} .block.solo .bk-n span{color:var(--ink-3)}
.block.solo .bk-tx{color:var(--ink-2)} .block.solo .bk-tx b{color:var(--ink)}
.btn.sky{background:var(--sky); border-color:var(--sky); color:#06202f}
.btn.ghost{background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.35); color:#fff}
.info-rail{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px, 78%); gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:14px -14px 0; padding:2px 14px 8px; scrollbar-width:none}
.info-rail::-webkit-scrollbar,.prail::-webkit-scrollbar{display:none}
.infocard{scroll-snap-align:start; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; box-shadow:var(--shadow)}
.infocard .ic{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:linear-gradient(150deg, #14486e, #06202f); color:var(--sky); margin-bottom:10px}
.infocard .ic svg{width:24px; height:24px}
.infocard b{font-family:var(--cond); font-size:20px}
.infocard p{margin:6px 0 0; color:var(--ink-2); font-size:14.5px}
.seg button[data-xcat] i{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--pc); margin-right:6px}
.radar{position:relative; border-radius:20px; background:radial-gradient(circle at 50% 50%, #0e3a5c, #071d2e 70%); overflow:hidden; max-width:560px}
.radar svg{display:block; width:100%; height:auto}
.radar .rg{fill:none; stroke:rgba(116,191,235,.22); stroke-dasharray:3 5}
.radar .rl{fill:rgba(169,216,243,.7); font:600 10px "IBM Plex Sans",sans-serif; text-anchor:middle}
.radar .sonar{fill:none; stroke:var(--sky); stroke-width:1.5; transform-box:fill-box; transform-origin:center; animation:sonar 3.6s ease-out infinite}
.radar .sonar.s2{animation-delay:1.8s}
@keyframes sonar{0%{transform:scale(1); opacity:.8}100%{transform:scale(8); opacity:0}}
.radar .hq rect{fill:#fff}
.radar .hq use{color:#0d314c}
.radar .dot{cursor:pointer; outline:none}
.radar .dot .hit{fill:transparent}
.radar .dot .pt{fill:var(--pc); stroke:#071d2e; stroke-width:2; transform-box:fill-box; transform-origin:center; animation:dot-in .5s cubic-bezier(.2,1.6,.4,1) both; animation-delay:var(--d)}
.radar .dot .pn{fill:#fff; font:600 11px "IBM Plex Sans",sans-serif; opacity:0; animation:fade-in .4s ease both; animation-delay:calc(var(--d) + .2s)}
.radar .dot:hover .pt,.radar .dot:focus .pt{stroke:#fff}
@keyframes dot-in{from{transform:scale(0)}}
@keyframes fade-in{to{opacity:.92}}
.sec-intro{color:var(--ink-2); margin:-4px 0 12px}
.prail{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(230px, 70%); gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -14px; padding:4px 14px 10px; scrollbar-width:none}
.plc{scroll-snap-align:start; position:relative; overflow:hidden; display:flex; flex-direction:column; gap:8px; text-align:left; min-height:230px; padding:16px; border-radius:18px; border:0; cursor:pointer; color:#fff; font:inherit;
  background:linear-gradient(155deg, color-mix(in srgb, var(--pc) 85%, #fff 0%), color-mix(in srgb, var(--pc) 35%, #06202f) 70%)}
.plc:after{content:""; position:absolute; right:-40px; bottom:-40px; width:160px; height:160px; border-radius:50%; border:22px solid rgba(255,255,255,.1)}

.pc-name{font-family:var(--cond); font-size:26px; font-weight:700; line-height:1.02; letter-spacing:-.01em; margin-top:6px}
.pc-text{font-size:14px; line-height:1.4; color:rgba(255,255,255,.9); display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.pc-foot{display:flex; gap:5px; align-items:center; margin-top:auto; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.85)}

.cover.place-cover{background:linear-gradient(155deg, var(--pc), color-mix(in srgb, var(--pc) 30%, #06202f) 75%)}
.cover .tag.dark{background:rgba(6,32,47,.3); color:#fff; border-left-color:#fff}

@media (min-width:760px){ .prail,.info-rail{grid-auto-columns:minmax(260px, 32%)} .radar{margin:0 auto} }

/* ---------- Players ---------- */
.player{position:relative; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#000; box-shadow:0 10px 30px rgba(6,32,47,.25)}
.player iframe{position:absolute; inset:0; width:100%; height:100%; border:0}

  background:linear-gradient(120deg, #b3372c, #e0533f 60%, #eb6834)}

.lv-tx b{display:block; font-family:var(--cond); font-size:19px}

.lv-dot{width:18px; height:18px; position:relative}

.ro-item.now{border-color:#b3372c; box-shadow:0 0 0 1px #b3372c}

.w-trivia .w-head{color:#a9d8f3}
.w-trivia .tv-orbit{position:absolute; right:-6%; top:50%; width:58%; max-width:300px; transform:translateY(-50%); z-index:-1}
.tv-wt{display:block; font-family:var(--cond); font-weight:700; font-size:clamp(24px, 6.6vw, 34px); line-height:1.02; margin-top:8px; letter-spacing:-.01em}
.tv-ws{display:block; color:rgba(255,255,255,.75); font-size:13.5px; margin-top:6px}
.tv-soon{display:inline-block; margin-top:12px; align-self:flex-start; background:linear-gradient(90deg, #eda100, #eb6834); color:#06202f; font-weight:800; font-size:12px; letter-spacing:.02em; padding:4px 10px; border-radius:5px; box-shadow:0 6px 18px -6px rgba(235,104,52,.8)}
.tv-orbit .tv-ring{fill:none; stroke:rgba(169,216,243,.28); stroke-width:1.5; stroke-dasharray:3 6}
.tv-orbit .tv-ring.in{stroke-dasharray:none; stroke:rgba(169,216,243,.14)}
.tv-orbit .tv-glow{animation:tv-breathe 4s ease-in-out infinite; transform-origin:center; transform-box:fill-box}
.tv-orbit .tv-spin{transform-origin:150px 150px; animation:tv-spin 26s linear infinite}
.tv-orb .halo{fill:var(--oc); opacity:.22; animation:tv-pulse 2.4s ease-in-out infinite; animation-delay:var(--d); transform-box:fill-box; transform-origin:center}
.tv-orb .core{fill:var(--oc); stroke:rgba(255,255,255,.85); stroke-width:2.5}
.tv-hex polygon{fill:#0d314c; stroke:#74bfeb; stroke-width:3; filter:drop-shadow(0 0 10px rgba(116,191,235,.7))}
.tv-hex{transform-origin:150px 150px; animation:tv-bob 3.2s ease-in-out infinite}
.tv-hex text{font-family:var(--cond); font-weight:800; font-size:60px; fill:#fff}
@keyframes tv-spin{to{transform:rotate(360deg)}}
@keyframes tv-pulse{0%,100%{transform:scale(1); opacity:.22}50%{transform:scale(1.45); opacity:.05}}
@keyframes tv-breathe{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes tv-bob{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tv-hero{position:relative; overflow:hidden; isolation:isolate; color:#fff; background:radial-gradient(120% 120% at 50% 20%, #14486e 0%, #071d2e 60%, #040f18 100%); padding:22px 20px 26px; text-align:center}
.tv-hero .tv-orbit{width:min(260px, 70vw); display:block; margin:0 auto -6px}
.tv-hero h2{font-family:var(--cond); font-size:clamp(38px, 11vw, 60px); line-height:.95; letter-spacing:-.02em; margin:8px 0 8px; background:linear-gradient(180deg, #fff, #a9d8f3); -webkit-background-clip:text; background-clip:text; color:transparent}
.tv-hero p{color:rgba(255,255,255,.82); max-width:30ch; margin:0 auto}
.tv-hero .tv-soon{margin-top:0}
.tv-modes{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tv-mode{position:relative; overflow:hidden; display:grid; gap:4px; align-content:start; background:var(--surface); border:1px solid var(--border); border-top:4px solid var(--mc); border-radius:14px; padding:14px; box-shadow:var(--shadow)}
.tv-mi{width:42px; height:42px; border-radius:11px; display:grid; place-items:center; background:color-mix(in srgb, var(--mc) 20%, transparent); color:var(--mc); margin-bottom:6px}
.tv-mi svg{width:22px; height:22px}
.tv-mode b{font-family:var(--cond); font-size:21px}
.tv-mode > span:not(.tv-mi){color:var(--ink-2); font-size:13.5px; line-height:1.4}
.tv-mode em{display:inline-flex; align-items:center; gap:5px; font-style:normal; font-weight:700; font-size:12.5px; color:var(--ink-3); margin-top:8px}
.tv-mode em svg{width:13px; height:13px}
.tv-cats{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.tv-cats.pick .tv-cat{cursor:pointer; text-align:left; font:inherit; color:var(--ink); grid-template-columns:auto 1fr auto; position:relative; transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease}
.tv-cats.pick .tv-cat.mixed{grid-column:1 / -1}
.tv-cats.pick .tv-cat{width:100%; min-width:0; align-content:center; row-gap:2px}
.tv-cats.pick .tv-cat > i{grid-column:1; grid-row:1 / span 2}
.tv-cats.pick .tv-cat > b{grid-column:2; grid-row:1}
.tv-cats.pick .tv-cat > span{grid-column:2; grid-row:2}
.tv-cats.pick .tv-cat > svg{grid-column:3; grid-row:1 / span 2; width:18px; height:18px; color:var(--oc); opacity:0; transition:opacity .15s ease}
.tv-cats.pick .tv-cat.on{border:2px solid var(--oc); box-shadow:0 8px 20px -12px var(--oc); transform:translateY(-1px)}
.tv-cats.pick .tv-cat.on > svg{opacity:1}
.tv-cats.pick.off{opacity:.45; pointer-events:none; filter:saturate(.6)}
/* the Board (Hard) */
.tb{display:grid; gap:12px}
.tb-top{display:flex; align-items:center; justify-content:space-between; gap:10px}
.tb-top .tg-score b{font-size:26px}
.tb-end{border:1px solid rgba(255,255,255,.25); background:transparent; color:#fff; border-radius:8px; padding:8px 12px; font:inherit; font-weight:700; cursor:pointer}
.tb-grid{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:5px}
.tb-h{display:flex; align-items:flex-end; justify-content:center; min-height:46px; padding:6px 1px; text-align:center; font-weight:800; font-size:clamp(9.5px, 2.55vw, 13px); letter-spacing:-.01em; line-height:1.15; color:#fff; background:#0b2a40; border-top:4px solid var(--cc); border-radius:6px; overflow-wrap:normal; word-break:keep-all; hyphens:none}
.tb-c{aspect-ratio:1/.82; display:grid; place-items:center; border:0; border-radius:6px; background:linear-gradient(160deg, #1b5a88, #0f3b5c); color:#f3c64f; font:inherit; font-weight:800; font-size:clamp(13px, 3.6vw, 22px); letter-spacing:-.01em; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tb.first .tb-c{animation:tile-in .35s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--k) * 30ms)}
@media (orientation:portrait){ .tb-c{aspect-ratio:auto; height:clamp(56px, calc((100dvh - 380px) / 5), 96px)} }
@media (orientation:landscape) and (max-height:560px){ .tb-c{aspect-ratio:auto; height:calc((100vh - 200px) / 5); min-height:34px} .tb-h{min-height:30px; padding-top:3px} .tb-note{display:none} }
.tb-c:hover{background:linear-gradient(160deg, #2370a8, #14486e)}
.tb-c:disabled{background:rgba(255,255,255,.04); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); color:transparent; cursor:default}
.tb-c.ok:disabled{background:rgba(27,175,122,.14)} .tb-c.no:disabled{background:rgba(235,104,52,.12)}
.tb-note{color:rgba(255,255,255,.7); font-size:13px; text-align:center; margin:0}
.tb-val{display:inline-block; font-weight:800; color:#f3c64f; font-size:15px}
.tb-dbl{display:block; text-align:center; font-family:var(--cond); font-weight:800; font-size:30px; color:#f3c64f; animation:tile-in .4s both}
.tv-playbox{margin:14px 0 22px; background:radial-gradient(120% 120% at 50% 0%, #14486e 0%, #071d2e 70%); border-radius:16px; padding:6px 14px 18px; text-align:center; color:#fff}
.tv-cat{display:grid; grid-template-columns:auto 1fr; column-gap:10px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; animation:tile-in .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 60ms)}
.tv-cat i{grid-row:span 2; width:16px; height:16px; border-radius:50%; background:var(--oc); box-shadow:0 0 0 4px color-mix(in srgb, var(--oc) 25%, transparent)}
.tv-cat b{font-size:14px; line-height:1.2}
.tv-cat span{color:var(--ink-2); font-size:12px; line-height:1.3}
.tv-board{background:linear-gradient(180deg, #0d314c, #071d2e); border-radius:16px; padding:18px 14px 14px; color:#fff; text-align:center}
.tv-board p{color:rgba(255,255,255,.75); font-size:13.5px; margin:12px 0 0}
.tv-facts{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px; margin-top:12px}
.tv-facts span{display:grid; justify-items:center; align-content:start; gap:5px; padding:9px 4px; border-radius:10px; background:rgba(255,255,255,.08); color:#fff; font-size:12px; font-weight:700; line-height:1.25; text-align:center}
.tv-facts svg{width:18px; height:18px; color:#74bfeb}
.tv-champ .tv-facts{margin:0 0 10px}
.tv-champ .tv-facts svg{color:#e2b33c}
.tv-podium{display:flex; justify-content:center; align-items:flex-end; gap:8px}
.tv-step{display:grid; justify-items:center; gap:6px; width:30%}
.tv-av{width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.1); border:2px dashed var(--pc); color:var(--pc); font-weight:800; font-size:18px}
.tv-ped{width:100%; display:grid; place-items:center; background:linear-gradient(180deg, var(--pc), color-mix(in srgb, var(--pc) 45%, #06202f)); border-radius:8px 8px 0 0}

.tv-step.s1 .tv-ped{height:92px}
.tv-step.s2 .tv-ped{height:66px}

.tv-stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px}
.tv-stats div{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 8px; text-align:center}
.tv-stats b{display:block; font-family:var(--cond); font-size:28px; color:var(--ink-3)}
.tv-stats span{font-size:12px; color:var(--ink-2); font-weight:600}
@media (prefers-reduced-motion: reduce){ .tv-orbit *, .tv-cat{animation:none !important} }

.sp-sess{background:var(--surface); border:1px solid var(--border); border-left:5px solid var(--sky); border-radius:14px; padding:14px; box-shadow:var(--shadow)}
.sp-sess > b{display:block; font-family:var(--cond); font-size:20px}
.sp-sess > span{display:flex; align-items:center; gap:6px; color:var(--ink-2); font-size:14px; margin-top:4px}

.sp-sess .d-actions{margin:12px 0 0}

/* Quarterly Championship */
.tv-champ{position:relative; overflow:hidden; background:radial-gradient(120% 120% at 50% 0%, #1b3a8a 0%, #0b1a4a 60%, #060d28 100%); border-radius:16px; padding:16px 14px; color:#fff; box-shadow:0 18px 40px -22px rgba(6,13,40,.9)}

@keyframes tc-glow{0%,80%,100%{filter:none}88%{filter:brightness(1.5) drop-shadow(0 0 6px rgba(245,197,66,.8))}}
.tv-champ p{color:rgba(255,255,255,.85); font-size:14px; margin:0 0 8px}
.tv-champ em{display:inline-flex; align-items:center; gap:5px; font-style:normal; font-weight:700; font-size:12.5px; color:rgba(255,255,255,.6)}
.tv-champ em svg{width:13px; height:13px}
@media (prefers-reduced-motion: reduce){ .tc-cell{animation:none} }

/* Trivia test round */

  background:linear-gradient(135deg, #14486e, #0d314c 55%, #06202f); border:1px solid rgba(116,191,235,.45); box-shadow:0 14px 30px -18px rgba(6,32,47,.8)}
