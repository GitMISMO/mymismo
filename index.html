<style>
:root{
  --navy:#0d314c; --sky:#74bfeb; --navy-deep:#06202f; --navy-mid:#14486e; --sky-soft:#a9d8f3; --sky-wash:#e4f2fb;
  --ground:#f1f6fa; --surface:#ffffff; --surface-2:#f6fafd; --surface-3:#e9f1f8;
  --border:#d5e2ed; --border-strong:#adc4d6; --rule:#e5eef5;
  --ink:#0d314c; --ink-2:#456179; --ink-3:#7794aa;
  --good:#0f7b5c; --bad:#b3372c; --warn:#a2701a;
  --link:#14486e; --accent-fill:#0d314c; --accent-ink:#ffffff; --star:#d99a00; --sel:#e4f2fb;
  --c1:#2477b8; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --shadow:0 1px 2px rgba(13,49,76,.06), 0 6px 18px rgba(13,49,76,.07);
  --bar-bg:rgba(255,255,255,.86);
  --tabbar-h:66px; --rail-w:0px;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
    --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
    --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
    --good:#4fc79b; --bad:#f08579; --warn:#e0a83c;
    --link:#74bfeb; --accent-fill:#74bfeb; --accent-ink:#06202f; --star:#f0b93a; --sel:#173c52;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9e2f;
    --shadow:none; --bar-bg:rgba(13,40,55,.88);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#061722; --surface:#0d2837; --surface-2:#123143; --surface-3:#173c52;
  --border:#1f4a63; --border-strong:#2f6688; --rule:#173547;
  --ink:#e9f4fb; --ink-2:#a6c5d9; --ink-3:#7a9db4;
  --good:#4fc79b; --bad:#f08579; --warn:#e0a83c;
  --link:#74bfeb; --accent-fill:#74bfeb; --accent-ink:#06202f; --star:#f0b93a; --sel:#173c52;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9e2f;
  --shadow:none; --bar-bg:rgba(13,40,55,.88);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--ground); color:var(--ink); font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom)); padding-left:var(--rail-w)}
button{font-family:inherit; font-size:inherit; color:inherit}
a{color:var(--link)}
h1,h2,h3{letter-spacing:-.012em; margin:0}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--sky); outline-offset:2px}

/* ---------- Masthead ---------- */
.mast{position:sticky; top:0; z-index:20; background:var(--navy); color:#fff; padding-top:env(safe-area-inset-top)}
.mast-in{display:flex; align-items:center; gap:10px; padding:9px 14px; max-width:1240px; margin:0 auto}
.lplate{position:relative; background:#fff; border:0; border-radius:5px; padding:7px 10px; display:flex; align-items:center; line-height:0; font:inherit; cursor:pointer; transition:transform .15s ease}
body.dash .lplate{cursor:default}
body:not(.dash) .lplate:active{transform:scale(.95)}
.lplate .wordmark{height:19px; width:auto}
.lplate .santa{position:absolute; display:none; pointer-events:none; left:-9px; top:-12px; width:28px; height:28px}
html[data-season="december"] .lplate .santa{display:block}
html[data-season="december"] .mast-in{padding-top:16px}
.vrule{width:1px; align-self:stretch; background:rgba(116,191,235,.4)}
.appname{color:var(--sky-soft); font-weight:500; font-size:16px; white-space:nowrap}
.mast-right{margin-left:auto; display:flex; align-items:center; gap:6px}
.theme-btn{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:5px; padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:inherit; white-space:nowrap}
.theme-btn:hover{background:rgba(255,255,255,.18)}
.mast-icon{position:relative; width:40px; height:40px; display:grid; place-items:center; border-radius:4px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:#fff; cursor:pointer}
.mast-icon svg{width:20px; height:20px}
.theme-btn[hidden]{display:none !important}   /* dark mode lives in Settings */
.mast-icon .ini-chip{font-size:12px; font-weight:700; letter-spacing:.02em}
.mast-icon .dot{position:absolute; top:-5px; right:-5px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--star); color:#06202f; font-size:10.5px; font-weight:700; display:none; place-items:center}
.mast-icon .dot.on{display:grid}

/* ---------- Pages ---------- */
main{max-width:1240px; margin:0 auto; padding:14px 14px 28px; overflow-x:clip}
.page{display:none}
.page.on{display:block}
.pagehead{display:flex; align-items:baseline; gap:12px; margin:6px 0 12px; flex-wrap:wrap}
.pagehead h1{font-family:var(--cond); font-size:30px; font-weight:700; letter-spacing:-.01em; line-height:1}
.pagehead .sub{color:var(--ink-2); font-size:14px}
.section-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:26px 0 10px}
.section-h h2{font-family:var(--cond); font-size:22px; font-weight:700; letter-spacing:-.005em}
.linkbtn{background:none; border:0; padding:0; color:var(--link); font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; min-width:max-content}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
  border-radius:6px; padding:10px 14px; font-weight:600; font-size:14px; cursor:pointer; white-space:nowrap; min-width:max-content; text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent-fill); color:var(--accent-ink); border-color:var(--accent-fill)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn:disabled{opacity:.55; cursor:default}
.btn svg{width:17px; height:17px; flex:none}
.tag{display:inline-block; border-radius:3px; padding:2px 7px; font-size:11.5px; font-weight:600; letter-spacing:.01em; white-space:nowrap;
  background:var(--surface-3); color:var(--ink-2); border-left:3px solid var(--tagc, var(--border-strong))}

/* ---------- The Summit Pass (home hero) ---------- */
.pass{position:relative; overflow:hidden; border-radius:14px; color:#fff; background:var(--navy-deep);
  padding:22px 20px 18px; isolation:isolate; display:grid; gap:18px}
.pass:before{content:""; position:absolute; inset:0; z-index:-2;
  background:
    radial-gradient(120% 90% at 100% 0%, rgba(116,191,235,.30), rgba(116,191,235,0) 55%),
    radial-gradient(90% 70% at 0% 100%, rgba(20,72,110,.9), rgba(20,72,110,0) 70%),
    linear-gradient(160deg, #0d314c 0%, #06202f 70%)}
.pass:after{content:""; position:absolute; inset:0; z-index:-1; opacity:.16;
  background-image:linear-gradient(rgba(116,191,235,.55) 1px, transparent 1px), linear-gradient(90deg, rgba(116,191,235,.55) 1px, transparent 1px);
  background-size:28px 28px; mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 60%, transparent 100%); -webkit-mask-image:linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 60%, transparent 100%)}
.pass .summit{font-weight:600; color:var(--sky-soft); font-size:15px}
.pass .city{font-family:var(--cond); font-weight:700; font-size:clamp(54px, 15.5vw, 132px); line-height:.86; letter-spacing:-.025em; margin:4px 0 0 -3px; color:#fff; text-wrap:balance}
.pass .when{display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:12px; color:rgba(255,255,255,.88); font-size:14.5px}
.pass .when span{display:inline-flex; align-items:center; gap:7px; white-space:nowrap}
.pass .when svg{width:16px; height:16px; color:var(--sky)}
.flip{display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap}
.flip .unit{display:grid; gap:6px; justify-items:start}
.flip .tiles{display:flex; gap:4px}
.flip .tile{position:relative; width:46px; height:62px; border-radius:7px; background:linear-gradient(180deg, #14486e 0 50%, #103d5e 50% 100%);
  border:1px solid rgba(116,191,235,.35); display:grid; place-items:center; font-family:var(--cond); font-weight:700; font-size:44px; color:#fff; overflow:hidden;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.flip .tile:after{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(6,32,47,.7)}
.flip .tile b{display:block; transform-origin:50% 50%}
.flip .tile.go b{animation:flipin .5s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flipin{0%{transform:rotateX(90deg); opacity:.2}100%{transform:none; opacity:1}}
.flip .lbl{font-size:12.5px; font-weight:600; color:var(--sky-soft)}
.flip .state{font-family:var(--cond); font-size:40px; font-weight:700; line-height:1; color:#fff}
.flip .state small{font-size:18px; color:var(--sky-soft); font-weight:600; margin-left:6px}
.pass-figs{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0 0}
.pass-figs button{position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; gap:3px; background:linear-gradient(180deg, #123d61, #0b2a44); border:1px solid rgba(116,191,235,.28); border-radius:14px; color:#fff; padding:12px 4px 12px; cursor:pointer; text-align:center; font:inherit; box-shadow:inset 0 1px 0 rgba(255,255,255,.06); transition:border-color .15s, transform .15s}
@media (max-width:699px){ .pass-figs button{justify-content:center; padding:14px 2px 12px} }
.pass-figs button:after{content:""; position:absolute; left:18%; right:18%; top:0; height:2px; background:linear-gradient(90deg, transparent, #74bfeb, transparent); opacity:.8}
.pass-figs button:hover{border-color:rgba(116,191,235,.7); transform:translateY(-1px)}
.pass-figs svg{width:24px; height:24px; color:#74bfeb; margin-bottom:4px}
.pass-figs b{display:block; font-family:var(--cond); font-size:28px; line-height:1.05; color:#fff}
.pass-figs span{font-size:13px; color:#fff; font-weight:700}

/* Your week: each day's sessions by type */
.week{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.wk{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 10px 12px; text-align:left; cursor:pointer; box-shadow:var(--shadow); display:grid; gap:8px}
.wk:hover{border-color:var(--border-strong)}
.wk .d{display:flex; align-items:baseline; gap:6px}
.wk .d b{font-family:var(--cond); font-size:28px; line-height:1}
.wk .d span{color:var(--ink-2); font-size:13px; font-weight:600}
.wk .stack{display:flex; flex-direction:column-reverse; gap:2px; height:64px; justify-content:flex-start}
.wk .stack i{display:block; border-radius:2px; background:var(--tagc)}
.wk .n{font-size:12.5px; color:var(--ink-2)}
.wk.today{border-color:var(--sky); box-shadow:0 0 0 2px var(--sky)}

/* On now rail */
.rail{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(250px, 78%); gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail.one{grid-auto-columns:100%}
.nowcard{scroll-snap-align:start; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:left; cursor:pointer; display:grid; gap:6px; box-shadow:var(--shadow); border-top:4px solid var(--tagc)}
.nowcard .t{font-weight:600; line-height:1.3}
.nowcard .m{color:var(--ink-2); font-size:13px}
.prog{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden}
.prog i{display:block; height:100%; background:var(--good)}

/* Session cards */
.list{display:grid; gap:8px}
.grid2{display:grid; gap:8px; grid-template-columns:1fr}
@media (min-width:760px){ .grid2{grid-template-columns:1fr 1fr} }
.slot{display:grid; grid-template-columns:54px 1fr; gap:10px; margin-top:12px}
.slot .tm{font-family:var(--cond); font-weight:700; font-size:18px; line-height:1.1; color:var(--ink); padding-top:10px; position:relative}
.slot .tm small{display:block; font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; font-weight:600; color:var(--ink-3)}
.slot.now .tm{color:var(--good)}
.slot.now .tm small{color:var(--good)}
.sess{display:grid; grid-template-columns:4px 1fr auto; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); width:100%}
.sess:hover{border-color:var(--border-strong)}
.sess .bar{background:var(--tagc, var(--border-strong))}
.sess .body{padding:11px 12px; min-width:0; border:0; background:none; text-align:left; cursor:pointer; color:inherit}
.sess .t{font-weight:600; font-size:15px; line-height:1.3}
.sess .m{color:var(--ink-2); font-size:13px; margin-top:4px; display:flex; flex-wrap:wrap; gap:4px 12px}
.sess .m span{display:inline-flex; gap:5px; align-items:center; white-space:nowrap}
.sess .m svg{width:14px; height:14px; color:var(--ink-3)}
.sess .extra{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.sess .spons{font-size:12.5px; color:var(--ink-2)}
.sess .spons b{color:var(--ink); font-weight:600}
.spline{display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex-basis:100%}
.spchips{display:inline-flex; gap:6px; flex-wrap:wrap}
.spchip{display:inline-grid; place-items:center; background:#fff; border:1px solid var(--border); border-radius:5px; height:30px; padding:3px 8px; min-width:52px}
.spchip img{max-height:22px; max-width:96px; object-fit:contain; display:block}
.spchip b{font-size:12px; color:#0d314c}
.cover .spline{margin-top:14px}
.cover .spons{color:rgba(255,255,255,.85); font-size:13px; font-weight:600}
.cover .spchip{height:36px; border-color:transparent}
.cover .spchip img{max-height:26px; max-width:120px}
.sess.live{border-color:var(--good); box-shadow:0 0 0 1px var(--good)}
.livetag{background:var(--good); color:#fff; border-radius:3px; padding:2px 6px; font-size:11px; font-weight:700; letter-spacing:.03em}
.star{align-self:center; margin-right:6px; width:42px; height:42px; border-radius:50%; border:0; background:transparent; cursor:pointer; display:grid; place-items:center; color:var(--ink-3)}
.star:hover{background:var(--surface-3)}
.star svg{width:23px; height:23px}
.star[aria-pressed="true"]{color:var(--star); --star-fill:currentColor}
.star.pop svg{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.35)}100%{transform:none}}
.faces{display:flex}
.faces img,.faces .ini{width:28px; height:28px; border-radius:50%; border:2px solid var(--surface); margin-left:-7px; object-fit:cover; background:var(--surface-3)}
.faces > :first-child{margin-left:0}
.ini{display:grid; place-items:center; font-size:10.5px; font-weight:700; color:var(--ink-2)}

/* Feature card (General Sessions) */
.feature{display:grid; grid-template-columns:1fr; background:var(--navy); color:#fff; border-radius:12px; overflow:hidden; cursor:pointer; border:0; text-align:left; padding:0; width:100%}
.feature .ph{display:grid; grid-template-columns:repeat(6,1fr); height:110px}
.feature .ph img,.feature .ph span{width:100%; height:100%; object-fit:cover; object-position:50% 25%; display:block; background:#14486e}
.feature .ph span{display:grid; place-items:center; color:var(--sky-soft); font-weight:700}
.feature .tx{padding:14px 16px 16px}
.feature .tx b{font-family:var(--cond); font-size:24px; display:block; line-height:1.1}
.feature .tx div{color:var(--sky-soft); margin-top:4px; font-size:14px}

/* Day switcher and filters */
.days{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; position:sticky; top:calc(54px + env(safe-area-inset-top)); z-index:5; background:var(--ground); padding:6px 0 8px}
html[data-season="december"] .days{top:calc(61px + env(safe-area-inset-top))}
.day{border:1px solid var(--border); background:var(--surface); border-radius:8px; padding:6px 4px 7px; cursor:pointer; text-align:center; line-height:1.05; display:grid; gap:2px}
.day b{font-family:var(--cond); font-size:26px}
.day span{font-size:12px; color:var(--ink-2); font-weight:600}
.day[aria-pressed="true"]{background:var(--accent-fill); border-color:var(--accent-fill); color:var(--accent-ink)}
.day[aria-pressed="true"] span{color:inherit; opacity:.85}
.tools{display:flex; gap:8px; margin:6px 0 4px; flex-wrap:wrap}
.search{flex:1 1 220px; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0 10px}
.search svg{width:17px; height:17px; color:var(--ink-3); flex:none}
.search input{border:0; outline:0; background:transparent; color:var(--ink); font:inherit; padding:10px 0; width:100%}
.chips{display:flex; gap:6px; overflow-x:auto; padding:2px 0 6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border); background:var(--surface); border-radius:5px; padding:6px 10px; font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:6px}
.chip i{width:9px; height:9px; border-radius:2px; background:var(--tagc, var(--border-strong)); display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--accent-fill); background:var(--sel); font-weight:600}
.seg{display:inline-grid; grid-auto-flow:column; max-width:100%; border:1px solid var(--border-strong); border-radius:7px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; margin-bottom:10px}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0; background:var(--surface); padding:8px 16px; font-weight:600; cursor:pointer; white-space:nowrap; border-right:1px solid var(--border-strong)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-fill); color:var(--accent-ink)}

/* Speakers: photo cards */
.faces-grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(158px,1fr))}
.pcard{position:relative; border:0; padding:0; border-radius:12px; overflow:hidden; cursor:pointer; aspect-ratio:4/5; background:var(--navy); text-align:left; color:#fff}
.pcard img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 22%}
.pcard .noimg{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--cond); font-size:56px; font-weight:700; color:var(--sky);
  background:radial-gradient(80% 60% at 70% 20%, rgba(116,191,235,.25), transparent), linear-gradient(160deg,#14486e,#06202f)}
.pcard .cap{position:absolute; left:0; right:0; bottom:0; padding:40px 12px 11px; background:linear-gradient(180deg, rgba(6,32,47,0), rgba(6,32,47,.92) 55%)}
.pcard .cap b{display:block; font-size:15.5px; line-height:1.2}
.pcard .cap span{display:block; font-size:12.5px; color:var(--sky-soft); line-height:1.3; margin-top:2px}

/* Attendees */
.people{display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(270px,1fr))}
.person{display:flex; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; text-align:left; box-shadow:var(--shadow); width:100%}
.person:hover{border-color:var(--border-strong)}
.avatar{width:52px; height:52px; border-radius:50%; object-fit:cover; flex:none; background:var(--surface-3); display:grid; place-items:center; font-weight:700; color:var(--ink-2); font-size:17px}
.avatar.c{color:#fff; background:linear-gradient(150deg, var(--navy-mid), var(--navy))}
.person .n{font-weight:600}
.person .r{color:var(--ink-2); font-size:13px; line-height:1.35}
.join{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; background:var(--navy); color:#fff; border-radius:12px; padding:16px}
.join svg{width:40px; height:40px; color:var(--sky)}
.join b{font-family:var(--cond); font-size:22px; display:block; line-height:1.1}
.join p{margin:4px 0 10px; color:var(--sky-soft)}
.join .btn.primary{background:var(--sky); border-color:var(--sky); color:#06202f}

/* Messages */
.thread{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; width:100%; text-align:left}
.thread .last{color:var(--ink-2); font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.thread .when{color:var(--ink-3); font-size:12px; white-space:nowrap}
.thread.unread{border-color:var(--sky); box-shadow:0 0 0 1px var(--sky)}
.thread.unread .n:after{content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--sky); margin-left:7px; vertical-align:2px}
.chat{display:flex; flex-direction:column; gap:6px; padding-bottom:8px}
.bub{max-width:82%; padding:9px 12px; border-radius:12px; font-size:15px; line-height:1.4; white-space:pre-wrap; word-wrap:break-word}
.bub.them{align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px}
.bub.me{align-self:flex-end; background:var(--navy-mid); color:#fff; border-bottom-right-radius:4px}
.bub small{display:block; font-size:11px; opacity:.7; margin-top:3px}
.compose{position:sticky; bottom:0; display:grid; grid-template-columns:1fr auto; gap:8px; padding:10px 0 4px; background:var(--ground)}
.compose textarea{resize:none; min-height:44px; max-height:140px; border:1px solid var(--border-strong); border-radius:8px; padding:10px 12px; font:inherit; color:var(--ink); background:var(--surface)}

/* Forms */
.field{display:grid; gap:5px; margin-bottom:12px}
.field label{font-weight:600; font-size:13.5px}
.field input,.field textarea{border:1px solid var(--border-strong); border-radius:7px; padding:10px 12px; font:inherit; color:var(--ink); background:var(--surface); width:100%}
.field .hint{color:var(--ink-3); font-size:12.5px}
.ld-in{border:1px solid var(--border-strong); border-radius:7px; padding:10px 12px; font:inherit; color:var(--ink); background:var(--surface); width:100%; min-width:0}
.codebox{font-family:var(--cond); font-size:34px; letter-spacing:.35em; text-align:center; font-weight:700; padding:10px 0 10px .35em !important}
.toggle{display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; margin-bottom:12px}
.toggle input{width:20px; height:20px; margin:2px 0 0; accent-color:var(--navy-mid); flex:none}
.toggle b{display:block; color:var(--ink)}
.toggle span{color:var(--ink-2); font-size:13.5px}
.err{color:var(--bad); font-weight:600; font-size:14px; margin:6px 0}
.okmsg{color:var(--good); font-weight:600; font-size:14px; margin:6px 0}

/* Sponsors */
.tier{margin-top:18px}
.tier h2{font-family:var(--cond); font-size:20px; font-weight:700; color:var(--ink); margin-bottom:8px; display:flex; align-items:center; gap:8px}
.tier h2 i{width:12px; height:12px; border-radius:2px; background:var(--tierc)}
.logos{display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(150px,1fr))}
.tier.big .logos{grid-template-columns:repeat(auto-fit, minmax(220px,1fr))}
.logo{background:#fff; border:1px solid var(--border); border-radius:10px; padding:14px; cursor:pointer; display:grid; place-items:center; min-height:96px; width:100%}
.tier.big .logo{min-height:124px}
.logo img{max-width:100%; max-height:58px; margin:auto; object-fit:contain; display:block}
.tier.big .logo img{max-height:76px}
.logo .nologo{font-size:15px; font-weight:600; color:#0d314c; text-align:center}
.strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(104px,1fr)); gap:8px}
.strip .logo{min-height:76px}
.strip .logo img{max-height:44px}


/* ---------- Feels like an app ---------- */
html{-webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,a,.wd,.plc,.spc{touch-action:manipulation}
.wd,.plc,.spc,.ch-opt,.tile,.sess .body,.btn,.livecard,.poster{transition:transform .14s ease, box-shadow .2s, background .2s}
.wd:active,.plc:active,.spc:active,.ch-opt:active,.btn:active,.livecard:active,.poster:active{transform:scale(.975)}
.btn.small{padding:7px 11px; font-size:13px}
.btn.big{padding:14px 20px; font-size:16px; width:100%}
.count{font-family:var(--cond); font-weight:700; font-size:15px; color:var(--ink-3)}
.lede{font-size:15.5px; color:var(--ink-2); margin:0 0 14px}

/* ---------- Masthead: the S goes back to the dashboard ---------- */
.smark{position:relative; display:none; width:40px; height:40px; border-radius:9px; border:0; background:#fff; place-items:center; cursor:pointer; padding:0; flex:none; box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.smark svg:first-child{width:34px; height:34px; color:#50a4db}
.smark .santa{position:absolute; display:none; pointer-events:none; left:-10px; top:-13px; width:28px; height:28px}
html[data-season="december"] .smark .santa{display:block}
body.dash nav.tabbar{display:none}
body.dash{padding-left:0; padding-bottom:env(safe-area-inset-bottom)}

/* ---------- The website's hero art, animated ---------- */
.hero-art{position:absolute; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none}
.ha-win rect{opacity:.25; animation:ha-tw 5.5s ease-in-out infinite}
.ha-glow{transform-box:fill-box; transform-origin:center; animation:ha-drift 16s ease-in-out infinite alternate}
.ha-run path{stroke-dasharray:90 1400; stroke-dashoffset:90; opacity:.9; animation:ha-run 6.5s cubic-bezier(.45,.05,.4,1) infinite}
.art-fade{position:absolute; inset:0; z-index:-1; pointer-events:none; background:linear-gradient(90deg, rgba(7,29,46,.92) 0%, rgba(7,29,46,.72) 38%, rgba(7,29,46,.25) 66%, rgba(7,29,46,0) 82%)}
.pass > span.art-fade{position:absolute; z-index:0; background:linear-gradient(180deg, rgba(7,29,46,.35) 0%, rgba(7,29,46,.2) 30%, rgba(7,29,46,.62) 62%, rgba(7,29,46,.9) 100%)}
.pass > .nola{opacity:.9}
.nola .no-stars circle{animation:no-twinkle 4s ease-in-out infinite}
.nola .no-halo{transform-box:fill-box; transform-origin:center; animation:no-halo 6s ease-in-out infinite}
.nola .no-flag{animation:no-sway 4.5s ease-in-out infinite}
.nola .no-lamp{transform-box:fill-box; transform-origin:center; animation:no-flicker 3.2s ease-in-out infinite}
.nola .no-door,.nola .no-clock{animation:no-door 7s ease-in-out infinite}
.nola .no-car{animation:no-car 24s linear infinite}
@keyframes no-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes no-halo{0%,100%{opacity:.8; transform:scale(1)}50%{opacity:1; transform:scale(1.06)}}
@keyframes no-sway{0%,100%{transform:skewY(0) rotate(0)}50%{transform:skewY(-3deg) rotate(2deg)}}
@keyframes no-flicker{0%,100%{opacity:.85; transform:scale(1)}20%{opacity:.6}40%{opacity:.95; transform:scale(1.08)}60%{opacity:.75}}
@keyframes no-door{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes no-car{0%{transform:translate(380px,478px)}100%{transform:translate(1260px,478px)}}
.nola .no-clock{animation:no-door 5s ease-in-out infinite}
@keyframes ha-tw{0%,100%{opacity:.2}45%{opacity:.95}}
@keyframes ha-drift{to{transform:translate(-80px,30px) scale(1.12)}}
@keyframes ha-run{0%{stroke-dashoffset:90; opacity:0}8%{opacity:.95}70%{opacity:.8}100%{stroke-dashoffset:-1000; opacity:0}}
.pass{background:#071d2e}
.pass:before,.pass:after{display:none}
.pass > :not(.hero-art){position:relative}
.pass > .hero-art{z-index:0}
.pass{isolation:isolate}
.pass:has(.hero-art) .flip, .pass:has(.hero-art) > div{z-index:1}

/* ---------- Summit welcome (Home) ---------- */
.welcome{margin-top:22px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
.wl-head{padding:20px 20px 18px; background:linear-gradient(135deg, var(--sky-wash, #e4f2fb), var(--surface) 70%); border-bottom:1px solid var(--border)}
:root[data-theme="dark"] .wl-head{background:linear-gradient(135deg, #14486e, var(--surface) 70%)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .wl-head{background:linear-gradient(135deg, #14486e, var(--surface) 70%)} }
.wl-eye{display:flex; align-items:center; gap:6px; color:var(--link); font-weight:700; font-size:13.5px; margin-bottom:8px}
.wl-eye svg{width:15px; height:15px; color:var(--star)}
.wl-title{font-family:var(--cond); font-size:clamp(30px, 8vw, 48px); line-height:1; letter-spacing:-.02em; color:var(--ink); text-wrap:balance}
.wl-sub{margin:10px 0 0; font-size:clamp(17px, 4.4vw, 22px); font-weight:600; color:var(--link)}
.wl-body{padding:16px 20px 14px}
.wl-body p{margin:0 0 10px; font-size:15.5px; line-height:1.6}
.wl-lede{font-size:16.5px !important}
.wl-glance{display:grid; gap:10px; margin-top:12px}
@media (min-width:640px){ .wl-glance{grid-template-columns:repeat(auto-fit, minmax(240px,1fr))} }
.wl-g{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; background:var(--surface); border:1px solid var(--border); border-left:5px solid var(--wc); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); animation:tile-in .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 80ms)}
.wl-cal{display:flex; gap:5px}
.wl-cal .cal{display:grid; flex:none; width:46px; border-radius:8px; overflow:hidden; background:var(--surface); border:1px solid var(--border); text-align:center; box-shadow:0 2px 6px -3px rgba(6,32,47,.35)}
.wl-cal .cal i{font-style:normal; font-size:10.5px; font-weight:700; color:#fff; background:var(--wc); padding:2px 0}
.wl-cal .cal b{font-family:var(--cond); font-size:22px; line-height:1.25; color:var(--ink)}
.wl-cal .cal.wide{width:auto; padding:6px 10px}
.wl-g.multi{grid-template-columns:1fr; gap:10px}
.wl-gtx b{display:block; font-family:var(--cond); font-size:18px}
.wl-gtx span{color:var(--ink-2); font-size:14px; line-height:1.4}
.wl-cta{position:relative; overflow:hidden; isolation:isolate; margin-top:12px; border-radius:16px; background:#071d2e; color:#fff}
.wl-cta > .hero-art{z-index:-1; opacity:.85}
.wl-cta-in{padding:22px 20px 20px}
.wl-closer{font-family:var(--cond); font-weight:700; font-size:clamp(24px, 6.6vw, 32px); line-height:1.08; margin:0 0 16px; color:#fff; max-width:18ch}
.wl-btns{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.wl-btns .btn{justify-content:center; margin:0}
.wl-reg{grid-column:1 / -1; background:var(--sky); border-color:var(--sky); color:#06202f; font-weight:700}
.wl-ghost{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.35); color:#fff}
@media (min-width:640px){ .wl-btns{grid-template-columns:repeat(3, max-content)} .wl-reg{grid-column:auto} .wl-btns .btn{padding-left:20px; padding-right:20px} }

/* ---------- My Dashboard ---------- */
.w-new{display:block; margin-top:6px; font-size:12.5px; color:var(--ink-2)}
.w-new b{color:var(--good); font-weight:700}
.dash-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:8px 0 16px}
.dh-date{color:var(--ink-2); font-weight:600; font-size:13.5px}
.dash-head h1{font-family:var(--cond); font-size:clamp(32px, 9vw, 44px); line-height:1; letter-spacing:-.02em; margin-top:3px}
.dash-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; grid-auto-flow:dense}
.wd{position:relative; overflow:hidden; isolation:isolate; display:flex; flex-direction:column; align-items:flex-start; gap:6px; text-align:left; border-radius:18px; padding:16px; min-height:150px; cursor:pointer; text-decoration:none;
  background:var(--surface); border:1px solid var(--border); color:var(--ink); box-shadow:var(--shadow); font:inherit}
.wd.wide{grid-column:1 / -1}
.w-head{display:flex; align-items:center; gap:7px; font-weight:700; font-size:13px; color:var(--ink-2); width:100%}
.w-head svg{width:18px; height:18px; color:var(--link); flex:none}
.w-head .go{margin-left:auto; width:18px; height:18px; opacity:.7}
.w-t{font-family:var(--cond); font-size:20px; font-weight:700; line-height:1.12; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:break-word}
.w-sub{color:var(--ink-2); font-size:13px; line-height:1.35; margin-top:auto}
.w-summit{min-height:230px; background:#071d2e; border:0; color:#fff}
.w-summit .w-head{color:var(--sky-soft)}
.w-summit .w-head svg{color:var(--sky); width:22px; height:22px}
.w-summit .w-head svg.go{width:18px; height:18px; margin:0 0 0 auto}
.w-city{font-family:var(--cond); font-weight:700; font-size:clamp(46px, 14vw, 84px); line-height:.86; letter-spacing:-.025em; margin-top:10px}
.w-name{color:rgba(255,255,255,.82); font-weight:600; font-size:14px}
.w-count{display:flex; align-items:baseline; gap:8px; margin-top:auto}
.w-count b{font-family:var(--cond); font-size:40px; line-height:1; color:var(--sky)}
.w-count i{font-style:normal; font-weight:600; color:#fff}

.infocard b{font-family:var(--cond); font-size:20px}
.infocard p{margin:6px 0 0; color:var(--ink-2); font-size:14.5px}
.seg button[data-xcat] i{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--pc); margin-right:6px}
.radar{position:relative; border-radius:20px; background:radial-gradient(circle at 50% 50%, #0e3a5c, #071d2e 70%); overflow:hidden; max-width:560px}
.radar svg{display:block; width:100%; height:auto}
.radar:not(.big){cursor:zoom-in}
.rd-big{position:absolute; right:10px; bottom:10px; width:38px; height:38px; display:grid; place-items:center; border-radius:10px; border:1px solid rgba(116,191,235,.45); background:rgba(7,29,46,.7); color:#fff; cursor:pointer}
.rd-big svg{width:20px; height:20px}
.rd-big:hover{background:rgba(20,72,110,.9)}
.rd-pop{display:grid; gap:12px}
.rd-scroll{overflow:auto; border-radius:20px; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; touch-action:pan-x pan-y}
/* Jonna, Nov 27, 2026: Around the Hotel opened big fills the whole screen sideways too, and a swipe up or down on the map scrolls the page */
.sheet.rd-full{left:0; width:auto}
.radar.big{max-width:none; width:max(100%, 600px); border-radius:20px}
.rd-hint{margin:0; font-size:13px; color:var(--ink-2); text-align:center}
.radar .rg{fill:none; stroke:rgba(116,191,235,.22); stroke-dasharray:3 5}
.radar .rl{fill:rgba(169,216,243,.7); font:600 10px "IBM Plex Sans",sans-serif; text-anchor:middle}
.radar .sonar{fill:none; stroke:var(--sky); stroke-width:1.5; transform-box:fill-box; transform-origin:center; animation:sonar 3.6s ease-out infinite}
.radar .sonar.s2{animation-delay:1.8s}
@keyframes sonar{0%{transform:scale(1); opacity:.8}100%{transform:scale(8); opacity:0}}
.radar .hq rect{fill:#fff}
.radar .hq use{color:#0d314c}
.radar .dot{cursor:pointer; outline:none}
.radar .dot .hit{fill:transparent}
.radar .dot .pt{fill:var(--pc); stroke:#071d2e; stroke-width:2; transform-box:fill-box; transform-origin:center; animation:dot-in .5s cubic-bezier(.2,1.6,.4,1) both; animation-delay:var(--d)}
.radar .dot .pn{fill:#fff; font:600 11px "IBM Plex Sans",sans-serif; opacity:0; animation:fade-in .4s ease both; animation-delay:calc(var(--d) + .2s)}
.radar .dot:hover .pt,.radar .dot:focus .pt{stroke:#fff}
@keyframes dot-in{from{transform:scale(0)}}
@keyframes fade-in{to{opacity:.92}}
.sec-intro{color:var(--ink-2); margin:-4px 0 12px}
.prail{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(230px, 70%); gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -14px; padding:4px 14px 10px; scrollbar-width:none}
.plc{scroll-snap-align:start; position:relative; overflow:hidden; display:flex; flex-direction:column; gap:8px; text-align:left; min-height:230px; padding:16px; border-radius:18px; border:0; cursor:pointer; color:#fff; font:inherit;
  background:linear-gradient(155deg, color-mix(in srgb, var(--pc) 85%, #fff 0%), color-mix(in srgb, var(--pc) 35%, #06202f) 70%)}
.plc:after{content:""; position:absolute; right:-40px; bottom:-40px; width:160px; height:160px; border-radius:50%; border:22px solid rgba(255,255,255,.1)}
.pc-top{display:flex; justify-content:space-between; align-items:flex-start; width:100%}
.pc-kind{font-size:12px; font-weight:700; background:rgba(6,32,47,.28); border-radius:5px; padding:3px 8px}
.pc-min{display:flex; align-items:baseline; gap:2px; background:#fff; color:#06202f; border-radius:10px; padding:4px 8px; line-height:1}
.pc-min b{font-family:var(--cond); font-size:22px}
.pc-min b svg{width:18px; height:18px}
.pc-min i{font-style:normal; font-size:11px; font-weight:700}
.pc-name{font-family:var(--cond); font-size:26px; font-weight:700; line-height:1.02; letter-spacing:-.01em; margin-top:6px}
.pc-text{font-size:14px; line-height:1.4; color:rgba(255,255,255,.9); display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.pc-foot{display:flex; gap:5px; align-items:center; margin-top:auto; font-size:12.5px; font-weight:600; color:rgba(255,255,255,.85)}
.pc-foot svg{width:15px; height:15px}
.cover.place-cover{background:linear-gradient(155deg, var(--pc), color-mix(in srgb, var(--pc) 30%, #06202f) 75%)}
.cover .tag.dark{background:rgba(6,32,47,.3); color:#fff; border-left-color:#fff}
.cover .d-title{font-family:var(--cond); font-size:34px; font-weight:700; line-height:1.02; margin-top:10px}
.cover .d-meta{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:10px; font-size:14px; color:rgba(255,255,255,.92)}
.cover .d-meta span{display:inline-flex; gap:6px; align-items:center}
.cover .d-meta svg{width:16px; height:16px}
@media (min-width:760px){ .prail,.info-rail{grid-auto-columns:minmax(260px, 32%)} .radar{margin:0 auto} }

/* ---------- Players ---------- */
.player{position:relative; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#000; box-shadow:0 10px 30px rgba(6,32,47,.25)}
.player iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
.poster{position:absolute; inset:0; border:0; padding:0; cursor:pointer; display:block; width:100%; background:#06202f}
.poster img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform 6s ease}

.poster .shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(6,32,47,.05), rgba(6,32,47,.75))}
.poster .pbtn{position:absolute; left:50%; top:50%; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; background:var(--sky); color:#06202f; display:grid; place-items:center; animation:halo 2.6s ease-in-out infinite}
.poster .pbtn svg{width:30px; height:30px; margin-left:3px}
.poster .plbl{position:absolute; left:14px; right:14px; bottom:12px; color:#fff; font-family:var(--cond); font-weight:700; font-size:18px; text-align:left}
@keyframes halo{0%,100%{box-shadow:0 0 0 0 rgba(116,191,235,.55)}50%{box-shadow:0 0 0 14px rgba(116,191,235,0)}}
.player.on{animation:player-in .35s ease}
@keyframes player-in{from{opacity:.4; transform:scale(.98)}}
.vchip{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:700; color:var(--link); background:var(--sel); border-radius:4px; padding:2px 7px}
.vchip svg{width:11px; height:11px}
.livecard{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; width:100%; margin-top:14px; padding:14px 16px; border-radius:16px; border:0; cursor:pointer; text-align:left; color:#fff; font:inherit;
  background:linear-gradient(120deg, #b3372c, #e0533f 60%, #eb6834)}
.livecard > svg{width:26px; height:26px}
.lv-tx b{display:block; font-family:var(--cond); font-size:19px}
.lv-tx span{font-size:13px; opacity:.9}
.nextsum{position:relative; overflow:hidden; isolation:isolate; display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px; margin-top:14px; padding:18px 18px 16px; border-radius:16px; background:#071d2e; color:#fff; border:1px solid rgba(243,198,79,.5); border-left:5px solid #f3c64f}
.nextsum > .hero-art{z-index:-1; opacity:.55}
.nextsum:after{content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg, rgba(7,29,46,.95), rgba(7,29,46,.55) 70%, rgba(7,29,46,.2))}
.nextsum.wd{margin-top:0; display:flex; flex-direction:row; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; text-align:left; min-height:0}
.nextsum .ns-in{flex:1 1 240px; justify-items:start}
.ns-in{display:grid; gap:2px; min-width:0}
.ns-eye{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; color:#f3c64f}
.ns-eye svg{width:15px; height:15px}
.ns-city{font-family:var(--cond); font-size:34px; line-height:1.05; letter-spacing:-.01em}
.ns-name{font-size:14px; color:#a9d8f3; font-weight:600}
.ns-when{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; font-size:13.5px; color:rgba(255,255,255,.88)}
.ns-when span{display:inline-flex; align-items:center; gap:6px} .ns-when svg{width:15px; height:15px; color:#74bfeb}
.ns-go{display:flex; align-items:center; gap:14px}
.ns-left{display:grid; text-align:center; font-size:11.5px; font-weight:600; color:#a9d8f3; line-height:1.1}
.ns-left b{font-family:var(--cond); font-size:26px; color:#fff}
.dash-live{margin-top:0; min-height:0}
.lv-dot{width:18px; height:18px; position:relative}
.lv-dot i,.lv-badge i{position:absolute; inset:3px; border-radius:50%; background:#fff; animation:livepulse 1.4s ease-out infinite}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.8)}100%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.live-wrap{background:#000}
.live-wrap .player{border-radius:0; box-shadow:none}
.live-bar{display:flex; gap:10px; align-items:center; padding:10px 14px; background:#06202f; color:#fff}
.lv-badge{position:relative; display:inline-flex; align-items:center; gap:6px; background:#b3372c; color:#fff; font-weight:700; font-size:12px; border-radius:4px; padding:3px 8px 3px 20px}
.lv-badge i{inset:auto; left:7px; top:50%; width:7px; height:7px; margin-top:-3.5px}
.ro-item.now{border-color:#b3372c; box-shadow:0 0 0 1px #b3372c}

/* ---------- Webinars, MISMO Matters, Certifications, pages in the app ---------- */
.webs{display:grid; gap:12px}
.web{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px}
.web-top{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start}
.web .cal{width:58px}
.web .wt{font-family:var(--cond); font-size:21px; font-weight:700; line-height:1.12}
.web .wm{color:var(--ink-2); font-size:13.5px; margin-top:4px; font-weight:600}
.web p{font-size:14.5px; margin:12px 0 14px}
.mat-hero{position:relative; overflow:hidden; border-radius:16px; padding:20px; color:#fff; background:linear-gradient(150deg, #14486e, #06202f 70%)}
.mat-hero:after{content:""; position:absolute; right:-60px; top:-60px; width:200px; height:200px; border-radius:50%; background:radial-gradient(closest-side, rgba(116,191,235,.45), transparent); animation:ha-drift 9s ease-in-out infinite alternate}
.mh-lbl{font-weight:700; color:var(--sky-soft); font-size:13px}
.mh-k{margin-top:10px; font-size:12.5px; font-weight:700; color:var(--sky)}

.list .row{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 14px; color:var(--ink); text-decoration:none; cursor:pointer; font:inherit; width:100%}

.sheet.full .sheet-body{display:flex}
.webframe{flex:1; display:flex}

/* ---------- Sponsors ---------- */
.sp-page{padding-top:0}
.sp-hero{position:relative; overflow:hidden; isolation:isolate; margin:0 -16px; padding:30px 20px 22px; color:#fff; background:#071d2e}
.sp-hero > .hero-art{z-index:-1}
.sp-hero h1{font-family:var(--cond); font-size:clamp(34px, 9.5vw, 54px); line-height:.98; letter-spacing:-.02em; max-width:12ch}
.sp-hero p{color:rgba(255,255,255,.85); margin:10px 0 16px; max-width:32ch}
.sp-stats{display:flex; gap:22px}
.sp-stats b{display:block; font-family:var(--cond); font-size:36px; line-height:1; color:var(--sky)}
.sp-stats span{font-size:12.5px; font-weight:600; color:rgba(255,255,255,.8)}
.ticker{overflow:hidden; margin:0 -16px 6px; padding:12px 0; background:var(--surface); border-bottom:1px solid var(--border); -webkit-mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask-image:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent)}
.ticker .run{display:flex; width:max-content; animation:tick var(--dur) linear infinite}
.tk{flex:none; margin-right:12px; width:120px; height:52px; display:grid; place-items:center; background:#fff; border:1px solid var(--border); border-radius:10px; padding:6px 10px}
.tk img{max-width:100%; max-height:38px; object-fit:contain}
@keyframes tick{to{transform:translateX(-50%)}}
.tier2{margin-top:22px}
.t2-h{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.t2-h h2{font-family:var(--cond); font-size:24px}
.medal{width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, var(--tierc) 55%); box-shadow:0 0 0 3px color-mix(in srgb, var(--tierc) 30%, transparent)}
.t2-grid{display:grid; gap:10px; grid-template-columns:repeat(auto-fill, minmax(150px,1fr))}
.tier2.top .t2-grid{grid-template-columns:1fr}
.spc{position:relative; overflow:hidden; display:flex; flex-direction:column; gap:10px; align-items:stretch; text-align:left; border:1px solid var(--border); border-top:4px solid var(--tierc); border-radius:14px; background:var(--surface); padding:12px; cursor:pointer; color:var(--ink); font:inherit; box-shadow:var(--shadow)}
.spc-logo{display:grid; place-items:center; height:78px; background:#fff; border-radius:10px; padding:10px}
.tier2.top .spc-logo{height:120px}
.spc-logo img{display:block; width:100%; height:100%; min-height:0; object-fit:contain; object-position:center}   /* fills the box and stays centered, whatever the logo's shape */
.spc-logo b{color:#0d314c}
.spc-tx b{display:block; font-size:15px}
.spc-tx span{display:block; color:var(--ink-2); font-size:12.5px; line-height:1.35; margin-top:3px}
.spc-tx span svg{width:12px; height:12px; color:var(--star); vertical-align:-1px; margin-right:4px}
.shine:after{content:""; position:absolute; top:-40%; left:-80%; width:45%; height:180%; transform:rotate(18deg); background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.55), rgba(255,255,255,0)); animation:sweep 5.5s ease-in-out 1s infinite; pointer-events:none}
.tier2:not(.top) .shine:after{animation-duration:7.5s; animation-delay:calc(1s + var(--sd, 0s))}
@keyframes sweep{0%{left:-80%}35%,100%{left:140%}}
.big-logo.halo{position:relative; overflow:visible}
.big-logo.halo:before{content:""; position:absolute; inset:-18px; border-radius:22px; background:radial-gradient(closest-side, rgba(116,191,235,.5), rgba(116,191,235,0)); z-index:-1; animation:halo-glow 3.6s ease-in-out infinite}
.big-logo.shine{overflow:hidden; position:relative}
@keyframes halo-glow{0%,100%{transform:scale(.94); opacity:.55}50%{transform:scale(1.04); opacity:1}}

@media (prefers-reduced-motion: reduce){
  .nola .no-stars circle,.nola .no-halo,.nola .no-flag,.nola .no-lamp,.nola .no-door,.nola .no-car,.nola .no-clock,.ha-win rect,.ha-glow,.ha-run path,.radar .sonar,.ticker .run,.shine:after,.big-logo.halo:before,.poster .pbtn,.w-logos img,.lv-dot i,.lv-badge i,.mat-hero:after,.pc-city,.ring .fg,.radar .dot .pt,.radar .dot .pn{animation:none !important}
  .ha-run path{opacity:0} .radar .dot .pn{opacity:.92} .w-logos img:first-child{opacity:1}
}

/* MISMO Trivia */
.w-trivia{position:relative; overflow:hidden; isolation:isolate; min-height:190px; border:0; color:#fff; background:radial-gradient(120% 140% at 85% 30%, #14486e 0%, #071d2e 55%, #040f18 100%); justify-content:center; padding-right:46%}
.w-trivia .w-head{color:#a9d8f3}

.w-merch .w-head{color:#14486e}
.mx-mock{margin-left:auto; font-style:normal; font-size:11px; font-weight:700; color:#8a5a00; background:#fdf0c8; border:1px solid #f0d27a; border-radius:5px; padding:2px 7px}
.mx-wt{font-family:var(--cond); font-weight:800; font-size:clamp(24px, 6vw, 32px); line-height:1.02; letter-spacing:-.01em; margin-top:4px; max-width:55%}
.mx-ws{font-size:13.5px; color:#456179; max-width:52%}
.mx-shelf{position:absolute; right:10px; bottom:12px; display:flex; align-items:flex-end; gap:0; width:min(52%, 330px); pointer-events:none}
.mx-sh{flex:1; margin-left:-10px; border-radius:12px; overflow:hidden; box-shadow:0 8px 18px -10px rgba(13,49,76,.5); transform:rotate(calc((var(--i) - var(--c, 1.5)) * 4deg)) translateY(calc((var(--i) - var(--c, 1.5)) * (var(--i) - var(--c, 1.5)) * 3px)); animation:mx-in .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 80ms)}

@keyframes mx-in{from{opacity:0; transform:translateY(20px)}}
.mx-go{display:inline-flex; align-items:center; gap:4px; margin-top:auto; font-weight:700; font-size:14px; color:#fff; background:#0d314c; border-radius:8px; padding:8px 12px}

.mx{--mx-ink:var(--ink)}

.tb-tg{width:38px; height:38px; display:grid; place-items:center; border-radius:8px; border:1px solid rgba(255,255,255,.22); background:transparent; color:rgba(255,255,255,.45); cursor:pointer; position:relative}

/* Jonna, Nov 26, 2026: a proper game-show board. A dark wall with blue screens and gold values; the screens flip on one
   by one when a board starts; a tapped square zooms up to fill the board and turns into the question card. */
.tg{position:relative}
.tb-wall{background:#020a12; padding:5px; border-radius:12px; box-shadow:0 0 0 2px rgba(243,198,79,.4), 0 18px 40px rgba(0,0,0,.5), inset 0 0 24px rgba(0,0,0,.7)}
.tb-grid{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:4px}
.tb-h{display:flex; align-items:center; justify-content:center; min-height:50px; padding:6px 2px; text-align:center; font-family:var(--cond); font-weight:800; font-size:clamp(10px, 2.7vw, 14px); letter-spacing:.01em; line-height:1.1; color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.6); background:radial-gradient(120% 100% at 50% 15%, #1f5fa6 0%, #143f73 70%, #0e3058 100%); border-bottom:3px solid var(--cc); border-radius:4px; overflow-wrap:normal; word-break:keep-all; hyphens:none}
.tb-c{aspect-ratio:1/.82; display:grid; place-items:center; border:0; border-radius:4px; background:radial-gradient(120% 95% at 50% 18%, #2467b6 0%, #164c8e 55%, #0e3564 100%); color:#f3c64f; font-family:var(--cond); font-weight:800; font-size:clamp(16px, 4.6vw, 30px); letter-spacing:-.01em; text-shadow:2px 2px 0 #000, 0 0 14px rgba(243,198,79,.3); cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 0 rgba(0,0,0,.35); transition:transform .15s, filter .15s, box-shadow .15s}
.tb.first .tb-h{animation:tb-head .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 110ms)}
.tb.first .tb-c{animation:tb-flip .5s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--rd)}
.tb.first .tb-c span{animation:tb-val .35s ease both; animation-delay:calc(var(--rd) + 700ms)}
.tb-c.just{animation:tb-gone .7s ease both}
.tb.back .tb-wall{animation:tb-back .35s ease both}
@keyframes tb-head{from{opacity:0; transform:translateY(-10px)}}
@keyframes tb-flip{0%{opacity:0; transform:perspective(520px) rotateX(-95deg)} 55%{opacity:1} 100%{transform:none}}
@keyframes tb-val{from{opacity:0; transform:scale(.6)}}
@keyframes tb-gone{0%{background:#f3c64f; box-shadow:0 0 24px rgba(243,198,79,.8)} 100%{}}
@keyframes tb-back{from{opacity:.4; transform:scale(.985)}}
/* the square zooming up to fill the board */
.tb-zoom{position:absolute; z-index:6; transform-origin:0 0; display:grid; place-items:center; border-radius:4px; background:radial-gradient(120% 95% at 50% 18%, #2467b6 0%, #164c8e 55%, #0e3564 100%); box-shadow:0 0 0 2px rgba(243,198,79,.6), 0 24px 60px rgba(0,0,0,.6); color:#f3c64f; font-family:var(--cond); font-weight:800; text-shadow:2px 2px 0 #000; transition:transform .5s cubic-bezier(.25,.8,.25,1), border-radius .5s, opacity .25s; overflow:hidden; pointer-events:none}
.tb-zoom{background:none; box-shadow:none; overflow:visible; transform-origin:50% 50%; transform-style:preserve-3d; transition:transform .75s cubic-bezier(.3,.7,.25,1)}
.tb-face{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:18px; border-radius:10px; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:radial-gradient(120% 95% at 50% 18%, #2467b6 0%, #164c8e 55%, #0e3564 100%); box-shadow:0 0 0 2px rgba(243,198,79,.6), 0 24px 60px rgba(0,0,0,.6); text-align:center}
.tb-face.back{transform:rotateY(180deg); justify-content:center; padding:46px 18px 22px}
.tb-face.back .tb-clue-h{position:absolute; left:14px; right:14px; top:12px}
/* fade the faces, not the 3D card itself (fading the card would flatten it and show the back of the front face) */
.tb-zoom.out .front{display:none}
.tb-zoom.out .back{opacity:0; transition:opacity .35s ease .1s}
.tb{transition:opacity .45s ease, transform .45s ease, filter .45s ease}
.tb.away{opacity:0; transform:scale(.96); filter:blur(2px); pointer-events:none}
.tb-next{position:absolute; left:16px; right:16px; top:14px; visibility:hidden}
.tb-next.in{visibility:visible}
.tb-next.done{position:static}
.tb-next .tb-clue{animation:none}
.tb-next .tg-top,.tb-next .tb-ask,.tb-next .tg-a{opacity:0}
.tb-next.in .tg-top{animation:tbx-down .5s cubic-bezier(.2,.8,.2,1) both}
.tb-next.in .tb-ask{animation:tbx-fade .5s ease both .15s}
.tb-next.in .tg-a{animation:tbx-up .55s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(.22s + var(--i) * .09s)}
@keyframes tbx-down{from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:none}}
@keyframes tbx-fade{from{opacity:0} to{opacity:1}}
@keyframes tbx-up{from{opacity:0; transform:translateY(16px) scale(.98)} to{opacity:1; transform:none}}
.tb-clue-wrap{transition:opacity .28s ease, transform .28s ease}
.tb-clue-wrap.leave{opacity:0; transform:scale(.98)}
.tb-clue-wrap > .tg-ans .tg-a{animation-delay:calc(var(--i) * 70ms)}
.tb-face .tb-dd{animation-delay:.45s}
.tb-face b{font-size:clamp(16px, 4.6vw, 30px)}
.tb-face h3{font-family:var(--cond); font-weight:800; font-size:clamp(22px, 6.4vw, 36px); line-height:1.15; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.85); margin:0}
.tb-ask{margin:-4px 0 0; text-align:center; font-size:13px; font-weight:700; color:rgba(255,255,255,.7)}
.tb-dd{display:grid; place-items:center; text-align:center; font-size:clamp(44px, 14vw, 88px); line-height:.95; color:#f3c64f; text-shadow:3px 3px 0 #000, 0 0 30px rgba(243,198,79,.5); animation:tb-dd .9s cubic-bezier(.2,.9,.2,1.2) both}
@keyframes tb-dd{0%{opacity:0; transform:scale(.2) rotate(-200deg)} 70%{opacity:1; transform:scale(1.08) rotate(6deg)} 100%{transform:none}}
/* the question card */
.tb-clue{position:relative; display:flex; flex-direction:column; justify-content:center; min-height:clamp(200px, 36vh, 340px); padding:46px 18px 22px; border-radius:10px; text-align:center; background:radial-gradient(120% 95% at 50% 18%, #2467b6 0%, #164c8e 55%, #0e3564 100%); box-shadow:0 0 0 2px rgba(243,198,79,.45), 0 18px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.2); animation:tb-in .3s ease both}
@keyframes tb-in{from{opacity:.5}}
.tb-clue h3{font-family:var(--cond); font-weight:800; font-size:clamp(22px, 6.4vw, 36px); line-height:1.15; color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.85); margin:0}
.tb-clue-h{position:absolute; left:14px; right:14px; top:12px; display:flex; align-items:center; justify-content:space-between; gap:10px}
.tb-clue-cat{display:inline-flex; align-items:center; text-align:left; gap:7px; font-size:13px; font-weight:800; color:#fff; text-shadow:0 1px 0 #000}
.tb-clue-cat i{width:10px; height:10px; border-radius:50%; background:var(--cc); box-shadow:0 0 8px var(--cc)}
.tb-clue-v{text-align:right; flex:none; font-family:var(--cond); font-weight:800; font-size:20px; color:#f3c64f; text-shadow:2px 2px 0 #000}
.tb-clock{position:relative; width:58px; height:58px}
.tb-clock b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--cond); font-size:22px}

/* ---------- Walk Me There (Jonna, Nov 27, 2026) ---------- */

.wk-cam{position:absolute; left:0; top:0; width:1079px; transform-origin:0 0; transition:transform 1.1s cubic-bezier(.45,0,.2,1); will-change:transform}

.wk-svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.wk-ghost{fill:none; stroke:rgba(13,49,76,.28); stroke-width:9; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:2 16}
.wk-line{fill:none; stroke:#eb6834; stroke-width:10; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.wk-start circle{fill:#fff; stroke:#0d314c; stroke-width:5} .wk-start .in{fill:#0d314c; stroke:none}
.wk-goal path{fill:#eb6834; stroke:#fff; stroke-width:4} .wk-goal .in{fill:#fff} .wk-goal .halo{fill:rgba(235,104,52,.18); stroke:none; transform:translateY(-4px)}
.wk-goal.here .halo{animation:wk-halo 1.4s ease-out infinite}

.wk-me circle{fill:#1a8fe3; stroke:#fff; stroke-width:5} .wk-me .pulse{fill:rgba(26,143,227,.25); stroke:none; animation:wk-pulse 1.6s ease-out infinite; transform-box:fill-box; transform-origin:center}

.wk-floor{position:absolute; left:12px; top:12px; z-index:2; background:#c59a46; color:#fff; font-family:var(--cond); font-weight:800; font-size:18px; padding:6px 12px; border-radius:8px; box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}

.wk-fade.go{animation:wk-lift 1.6s ease-in-out}

.fm-key{display:flex; flex-wrap:wrap; gap:6px 16px; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--surface); font-size:12.5px; color:var(--ink-2)}

.pros{display:grid; gap:8px; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); margin-top:10px; max-height:440px; overflow-y:auto}
.pro{display:flex; gap:10px; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 10px}
.pro .ini{width:38px; height:38px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; color:#fff; background:linear-gradient(135deg, hsl(var(--h) 55% 45%), hsl(calc(var(--h) + 40) 55% 32%))}
.pro b{display:block; font-size:14px}
.pro span span{color:var(--ink-2); font-size:12.5px}
@media (prefers-reduced-motion: reduce){ .cert-seal:after,.sparkle:after,.site-tile{animation:none} .bar .bt i{transition:none} }

/* Sponsor's home page, small */
.sitepeek{display:block; margin-top:16px; border-radius:12px; overflow:hidden; border:1px solid var(--border-strong); background:var(--surface); box-shadow:0 12px 30px rgba(6,32,47,.18); text-decoration:none; color:var(--ink)}
.pk-bar{display:flex; align-items:center; gap:6px; padding:8px 10px; background:var(--surface-3); border-bottom:1px solid var(--border)}
.pk-bar i{width:10px; height:10px; border-radius:50%; background:#e0533f}
.pk-bar i:nth-child(2){background:#eda100}
.pk-bar i:nth-child(3){background:#1baf7a}
.pk-url{flex:1; display:flex; align-items:center; gap:5px; margin-left:8px; background:var(--surface); border-radius:6px; padding:3px 9px; font-size:12.5px; color:var(--ink-2); overflow:hidden; white-space:nowrap}
.pk-url svg{width:12px; height:12px; flex:none}
.pk-shot{position:relative; display:block; aspect-ratio:4/3; overflow:hidden; background:#fff}
.pk-shot img{display:block; width:100%; height:100%; object-fit:cover; object-position:top; opacity:0; transition:opacity .5s, transform 8s ease}
.sitepeek.ready .pk-shot img{opacity:1}
.sitepeek:hover .pk-shot img{transform:translateY(-6%)}
.pk-wait{position:absolute; inset:0; background:linear-gradient(100deg, var(--surface-2) 30%, var(--surface-3) 50%, var(--surface-2) 70%); background-size:200% 100%; animation:shimmer 1.4s linear infinite}
.sitepeek.ready .pk-wait{display:none}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){ .pk-wait{animation:none} .pk-shot img{transition:none} }

/* Certified provider */
button.tl-c{width:100%; text-align:left; cursor:pointer; color:var(--ink); font:inherit}
button.tl-c:hover{border-color:var(--border-strong)}
.tl-go{margin-left:auto; color:var(--ink-3); display:inline-flex}
.tl-go svg{width:16px; height:16px}
.pv-tag{color:rgba(255,255,255,.85); margin-top:4px}
.pv-tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.pv-tags span{font-size:12px; font-weight:700; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); border-radius:4px; padding:3px 8px}
.cover .k svg{width:13px; height:13px; vertical-align:-2px; margin-right:5px}
.badges{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:10px}
.badge-c{display:grid; justify-items:center; text-align:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 10px; text-decoration:none; color:var(--ink); animation:tile-in .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 70ms)}
.badge-c img{width:86px; height:86px; object-fit:contain; filter:drop-shadow(0 6px 12px rgba(6,32,47,.2))}
.badge-c b{font-size:14px; line-height:1.25}
.badge-c span{color:var(--link); font-size:12.5px; font-weight:600}
.list .row .tag{margin-left:auto}
.list .row em{font-style:normal; color:var(--ink-3); font-size:12.5px; font-weight:600}
.pv-about p{font-size:15px; line-height:1.6; margin:0 0 10px}

/* Certification tiles */
.ctiles{display:grid; gap:12px}
@media (min-width:640px){ .ctiles{grid-template-columns:1fr 1fr} .ctile.wide{grid-column:1 / -1} }
.ctile{position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-top:5px solid var(--c); border-radius:16px; padding:14px; box-shadow:var(--shadow); animation:tile-in .45s cubic-bezier(.2,.8,.2,1) both; animation-delay:calc(var(--i) * 60ms)}
.ctile:before{content:""; position:absolute; right:-40px; top:-40px; width:130px; height:130px; border-radius:50%; background:var(--c); opacity:.08}
.ct-h{display:flex; gap:12px; align-items:center}
.ct-ic{width:46px; height:46px; flex:none; border-radius:12px; display:grid; place-items:center; color:#fff; background:linear-gradient(140deg, var(--c), color-mix(in srgb, var(--c) 55%, #06202f))}
.ct-ic svg{width:24px; height:24px}
.ct-h b{display:block; font-family:var(--cond); font-size:20px; line-height:1.1}
.ct-h > div > span{color:var(--ink-2); font-size:13px; font-weight:600}
.ct-h em{font-style:normal; font-family:var(--cond); font-size:20px; font-weight:700; color:var(--c)}
.ct-b{font-size:13.5px; color:var(--ink-2); margin:10px 0 4px}
.ct-list{display:grid; gap:6px; margin-top:10px}
.ct-m{display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; width:100%; text-align:left; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:4px 10px 4px 4px; cursor:pointer; color:var(--ink); font:inherit; text-decoration:none}
.ct-m:hover{border-color:var(--c)}
.ct-logo{width:60px; height:32px; border-radius:6px; background:#fff; display:grid; place-items:center; padding:3px 5px; border:1px solid var(--border)}
.ct-logo img{max-width:100%; max-height:100%; object-fit:contain}
.ct-logo img + i, .ct-logo.no img{display:none}
.ct-logo.no i{display:block}
.ct-logo i{font-style:normal; font-weight:700; font-size:12px; color:#0d314c}
.ct-n{font-weight:600; font-size:14px}
.ct-m > svg{width:16px; height:16px; color:var(--ink-3)}
.ct-list .ct-m.more, .ct-people .pro.more{display:none}
.ct-list.all .ct-m.more, .ct-people.all .pro.more{display:grid}
.ct-people.all .pro.more{display:flex}
.ct-all{margin-top:8px; width:100%; border:1px dashed var(--border-strong); background:none; border-radius:8px; padding:8px; font-weight:700; color:var(--link); cursor:pointer; font:inherit; font-weight:700}
.ct-about{display:inline-flex; align-items:center; gap:5px; margin-top:10px; font-size:13px; font-weight:600; color:var(--link); text-decoration:none}
.ct-about svg{width:13px; height:13px}
.ctile .search{margin-top:10px}
.ct-people{display:grid; gap:6px; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); margin-top:10px}

/* Speaker bio */
.bio-btn{margin:0 0 4px}
.bio{font-size:15.5px; line-height:1.6; margin-top:12px; padding:14px 16px; background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--sky); border-radius:10px; animation:bio-in .28s ease}
.bio p{margin:0 0 10px}
.bio p:last-child{margin:0}
@keyframes bio-in{from{opacity:0; transform:translateY(-6px)}}

/* Notes and banners */
.note{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--sky); border-radius:8px; padding:12px 14px; color:var(--ink-2); font-size:14px}
.note b{color:var(--ink)}
.overlap{color:var(--warn); font-size:12.5px; font-weight:600; margin:4px 0 0}
.install{display:none; align-items:center; gap:12px; background:var(--sel); border:1px solid var(--border-strong); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-size:14px}
.install.on{display:flex}
.install .x{margin-left:auto; background:none; border:0; cursor:pointer; color:var(--ink-2); padding:6px; display:grid; place-items:center}
.install img{width:36px; height:36px; border-radius:8px}
.foot{color:var(--ink-3); font-size:12px; margin-top:28px; text-align:center}

/* ---------- Tab bar (bottom in portrait, side rail in landscape) ---------- */
nav.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bar-bg); -webkit-backdrop-filter:saturate(1.6) blur(14px); backdrop-filter:saturate(1.6) blur(14px);
  border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar .in{max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); height:var(--tabbar-h)}
nav.tabbar button{background:none; border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; color:var(--ink-3); font-size:11px; font-weight:600; position:relative; white-space:nowrap; padding:0 2px; min-width:0}
nav.tabbar button svg{width:24px; height:24px; transition:transform .2s}
nav.tabbar button[aria-current]{color:var(--ink)}
nav.tabbar button[aria-current] svg{transform:translateY(-1px); color:var(--navy-mid)}
:root[data-theme="dark"] nav.tabbar button[aria-current] svg{color:var(--sky)}
nav.tabbar button[aria-current]:before{content:""; position:absolute; top:0; left:24%; right:24%; height:3px; background:var(--sky); border-radius:0 0 2px 2px}
nav.tabbar .badge{position:absolute; top:7px; left:calc(50% + 6px); background:var(--star); color:#06202f; font-size:10px; font-weight:700; border-radius:9px; min-width:18px; height:18px; padding:0 5px; display:none; place-items:center; line-height:1}
nav.tabbar .badge.on{display:grid}

/* ---------- Sheets (detail panels) ---------- */
.sheet-back{position:fixed; inset:0; background:rgba(6,32,47,.5); z-index:40; opacity:0; transition:opacity .2s}
.sheet{position:fixed; z-index:41; left:0; right:0; bottom:0; top:calc(26px + env(safe-area-inset-top)); background:var(--ground); border-radius:14px 14px 0 0; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .26s cubic-bezier(.2,.8,.2,1); box-shadow:0 -10px 34px rgba(6,32,47,.28); overflow:hidden}
.sheet.on{transform:none}
.sheet-back.on{opacity:1}
.sheet-head{display:flex; align-items:center; gap:8px; padding:12px 12px 10px; position:relative; z-index:2}
.sheet-head .grab{position:absolute; left:50%; top:5px; width:40px; height:4px; border-radius:2px; background:rgba(255,255,255,.5); transform:translateX(-50%)}
.sheet-head .title{font-weight:600; font-size:14px; color:rgba(255,255,255,.85); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sheet.plain .sheet-head{background:var(--surface); border-bottom:1px solid var(--border)}
.sheet.plain .sheet-head .title{color:var(--ink-2)}
.sheet.plain .sheet-head .grab{background:var(--border-strong)}
.iconbtn{border:1px solid var(--border); background:var(--surface); border-radius:7px; width:38px; height:38px; display:grid; place-items:center; cursor:pointer; color:var(--ink); flex:none}
.iconbtn svg{width:19px; height:19px}
.sheet-head .iconbtn.close{margin-left:auto}
.sheet:not(.plain) .sheet-head{position:absolute; left:0; right:0; top:0}
.sheet:not(.plain) .iconbtn{background:rgba(6,32,47,.35); border-color:rgba(255,255,255,.25); color:#fff}
.sheet-body{overflow-y:auto; overflow-x:hidden; flex:1; -webkit-overflow-scrolling:touch}
.sheet-pad{padding:16px 16px calc(28px + env(safe-area-inset-bottom))}
.cover{color:#fff; padding:64px 18px 20px; background:var(--tagc, var(--navy)); position:relative; overflow:hidden}
.cover:before{content:""; position:absolute; inset:0; background:linear-gradient(160deg, rgba(6,32,47,.15), rgba(6,32,47,.7))}
.cover > *{position:relative; z-index:1}
.cover > .hero-art{position:absolute; z-index:0; opacity:.9}
.cover .k{display:inline-block; font-size:12.5px; font-weight:700; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.3); border-radius:4px; padding:3px 8px}
.cover h2{font-family:var(--cond); font-size:30px; line-height:1.05; margin-top:10px; letter-spacing:-.01em}
.cover .w{margin-top:12px; display:grid; gap:5px; color:rgba(255,255,255,.92); font-size:14.5px}
.cover .w div{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.cover .w svg{width:16px; height:16px; flex:none; opacity:.85}
.cover.person-cover{display:flex; gap:16px; align-items:flex-end}
.cover.person-cover img,.cover.person-cover .avatar{width:104px; height:104px; border-radius:12px; object-fit:cover; object-position:50% 22%; border:2px solid rgba(255,255,255,.4); font-size:34px; background:rgba(255,255,255,.12); color:#fff}
.d-actions{display:flex; gap:8px; flex-wrap:wrap}
.d-actions.two{display:grid; grid-template-columns:1fr 1fr; max-width:460px}
.d-actions.two .btn{min-width:0; padding:10px 8px; font-size:13.5px}
.btn.on-mine{--star-fill:currentColor}
.d-desc{margin-top:16px; font-size:15.5px; line-height:1.55}
.d-h{font-family:var(--cond); font-size:20px; font-weight:700; margin:24px 0 8px}
.ro{display:grid; gap:8px}
.ro-item{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; display:grid; grid-template-columns:70px 1fr; gap:10px}
.ro-item .tm{font-family:var(--cond); font-weight:700; font-size:17px; line-height:1.15}
.ro-item .tm span{display:block; font-family:"IBM Plex Sans",sans-serif; font-size:12px; font-weight:500; color:var(--ink-3)}
.ro-item .k{margin-bottom:4px}
.ro-item .tt{font-weight:600; line-height:1.3}
.ro-item .ds{color:var(--ink-2); font-size:14px; margin-top:4px}
.ro-item.brk{background:var(--surface-2); color:var(--ink-2)}
.ro-people{display:grid; gap:4px; margin-top:8px}
.pp{display:flex; gap:10px; align-items:center; border:0; background:none; padding:4px 0; cursor:pointer; text-align:left; width:100%}
.pp img,.pp .avatar{width:42px; height:42px; font-size:14px}
.pp .n{font-weight:600; font-size:14px}
.pp .r{color:var(--ink-2); font-size:12.5px; line-height:1.3}
.sp-card{display:flex; gap:14px; align-items:center; justify-content:center; background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; width:100%; min-height:72px}
.sp-card img{max-width:160px; max-height:50px; object-fit:contain}
.sp-card span{color:#0d314c; font-weight:600}
.big-logo{background:#fff; border-radius:10px; padding:22px; display:grid; place-items:center; min-height:150px}
.big-logo img{max-width:min(320px,100%); max-height:110px; object-fit:contain}

/* ---------- Loading screen ---------- */
#loading{position:fixed; inset:0; z-index:100; background:var(--navy-deep); display:grid; place-items:center; transition:opacity .35s}
#loading.done{opacity:0; pointer-events:none}
#loading .in{display:grid; gap:18px; justify-items:center}
#loading .lplate{padding:calc(min(300px, 62vmin) * .06) calc(min(300px, 62vmin) * .09); border-radius:6px}
#loading .lplate .wordmark{width:min(300px, 62vmin); height:auto}
#loading .in{position:relative}
#loading .bar{position:absolute; left:50%; top:calc(100% + 26px); transform:translateX(-50%)}
#loading .lbl{color:var(--sky-soft); font-weight:500; font-size:15px}
#loading .bar{width:160px; height:3px; background:rgba(116,191,235,.25); border-radius:2px; overflow:hidden}
#loading .bar i{display:block; height:100%; width:40%; background:var(--sky); animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
#loading .errtxt{color:#fff; max-width:320px; text-align:center; display:none; position:absolute; top:calc(100% + 20px); left:50%; transform:translateX(-50%); width:80vw}

/* ---------- Sizes and orientation ---------- */
@media (min-width:700px){
  .pass{grid-template-columns:1.35fr 1fr; align-items:end; padding:28px 26px 22px; column-gap:26px}
  .pass .flip{justify-content:flex-end; padding-bottom:0; flex-wrap:nowrap}
  .pass-figs{grid-column:auto; margin:12px 0 0}
  .rail{grid-auto-columns:minmax(260px, 32%)}
}
@media (min-width:900px){
  .sheet{left:auto; top:0; width:min(72vw, 880px); border-radius:0; transform:translateX(100%)}
  .sheet-head .grab{display:none}
}
@media (max-width:520px){
  .week{grid-template-columns:repeat(4,1fr); gap:6px}
  .wk{padding:8px 7px 10px}
  .wk .d b{font-size:24px}
  .appname{font-size:15px}
  .flip .tile{width:36px; height:50px; font-size:34px}
  .flip{gap:10px}
}
@media (max-width:440px){ .appname{display:none} .vrule{display:none} }
@media (max-width:420px){ body:not(.dash) .theme-btn{display:none} }
/* Landscape phones: the tab bar becomes a rail down the left so the screen keeps its height */
@media (orientation:landscape) and (max-height:540px){
  :root{--rail-w:calc(84px + env(safe-area-inset-left)); --tabbar-h:0px}
  body{padding-bottom:env(safe-area-inset-bottom)}
  nav.tabbar{top:0; right:auto; width:var(--rail-w); border-top:0; border-right:1px solid var(--border); padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left)}
  nav.tabbar .in{grid-template-columns:1fr; grid-auto-rows:1fr; height:100%; max-width:none}
  nav.tabbar button[aria-current]:before{top:22%; bottom:22%; left:auto; right:0; width:3px; height:auto; border-radius:2px 0 0 2px}
  .mast-in{padding-left:max(14px, env(safe-area-inset-left))}
  .pass{grid-template-columns:1.3fr 1fr; align-items:end; padding:18px 20px 20px; column-gap:18px}
  .pass .city{font-size:clamp(48px, 10vw, 96px)}
  .pass .flip{justify-content:flex-end; padding-bottom:0; flex-wrap:nowrap; gap:10px}
  .pass .flip .tile{width:clamp(30px, 3.6vw, 46px); height:clamp(42px, 5vw, 62px); font-size:clamp(28px, 3.4vw, 40px)}
  .pass-figs{grid-column:auto; margin:12px 0 0}
  .grid2{grid-template-columns:1fr 1fr}
  .rail{grid-auto-columns:minmax(250px, 46%)}
  .days{top:calc(50px + env(safe-area-inset-top))}
  .sheet{left:auto; top:0; width:min(78vw, 760px); border-radius:0; transform:translateX(100%)}
  .sheet-head .grab{display:none}
  .faces-grid{grid-template-columns:repeat(auto-fill, minmax(140px,1fr))}
}
@media (prefers-reduced-motion: reduce){ .sheet,.sheet-back{transition:none} #loading .bar i{animation:none} .flip .tile.go b,.star.pop svg{animation:none} }
</style>
</head>

var PV = { state: '', people: [] };
function canPreviewAttendees() {
  var st = staffSession(); if (!st || !appTester()) return false;

  return !!(acc['summit-hq'] || st.platformAdmin);   /* the list itself is read from Summit HQ */

function loadPreviewAttendees() {
  if (PV.state) return; PV.state = 'loading';
  var tok = ResourcesSession.token && ResourcesSession.token();
  fetch(RELAY + '/summit-hq/file/data/feed-mymismo-attendees.json', { cache: 'no-store', headers: { Authorization: 'Bearer ' + tok } })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (j) {
      var bytes = Uint8Array.from(atob(j.content), function (c) { return c.charCodeAt(0); });
      var d = JSON.parse(new TextDecoder().decode(bytes)), s = d.summits && d.summits[S.sid];
      /* registration numbers, for name tag scanning (CN-055); and this staff member's own, for the Test Badge */
      PV.byReg = {}; PV.hasReg = false; PV.myReg = '';
      var meE = String((staffSession() || {}).email || '').toLowerCase();
      (s && s.people || []).forEach(function (p) {
        var regs = Array.isArray(p.reg) ? p.reg : p.reg ? [p.reg] : [];
        regs.forEach(function (n) { PV.hasReg = true; PV.byReg[String(n)] = { name: ((p.first || '') + ' ' + (p.last || '')).trim(), title: p.title || '', company: p.company || '' }; });
        if (meE && p.e === meE && regs.length && !PV.myReg) PV.myReg = String(regs[0]);
      });
      PV.people = (s && s.people || []).map(function (p, i) { var rg = Array.isArray(p.reg) ? p.reg : p.reg ? [p.reg] : []; return { id: 'pv' + i, name: ((p.first || '') + ' ' + (p.last || '')).trim(), title: p.title || '', company: p.company || '', reg: rg[0] ? String(rg[0]) : '', photo: 0, joined: false, preview: true }; })
        .filter(function (p) { return p.name; });
      /* MISMO staff are in Summit HQ's list twice: their registration (with their title) and the staff roster (just
         "MISMO"). Keep the registration; someone only on the roster stays. */
      var plain = function (p) { return /^mismo$/i.test(p.company.trim()) && !p.title.trim(); }, byName = {};
      PV.people.forEach(function (p) { var k = p.name.toLowerCase(); (byName[k] = byName[k] || []).push(p); });
      PV.people = PV.people.filter(function (p) { var g = byName[p.name.toLowerCase()]; return !(plain(p) && g.some(function (o) { return !plain(o); })); });
      /* Jonna, Nov 26, 2026: someone registered twice (Rhoshunda Kelly: "Commissioner" and "Commisioner", "&" and "and")
         shows once. Same name and the same company, give or take punctuation; the one that matches their speaker
         listing wins, otherwise the first. Different companies stay apart: that could be two people. */
      var co = function (c) { return String(c || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, ' ').replace(/\b(the|inc|llc|corp|corporation|co)\b/g, ' ').replace(/\s+/g, ' ').trim(); };
      var spk = {}; (S.speakers || []).forEach(function (x) { spk[x.name.toLowerCase()] = x; });
      var keep = {};
      PV.people.forEach(function (p) {
        var k = p.name.toLowerCase() + '|' + co(p.company), have = keep[k], sp = spk[p.name.toLowerCase()];
        if (!have) { keep[k] = p; return; }
        if (sp && (sp.title || '') === p.title && (have.title || '') !== (sp.title || '')) keep[k] = p;
      });
      PV.people = Object.keys(keep).map(function (k) { return keep[k]; }).sort(function (a, b) { return a.name.localeCompare(b.name); });
      PV.state = 'ready';
    })
    .catch(function () { PV.state = 'error'; })
    .then(function () { if (S.page === 'people') renderPage('people'); });
}
