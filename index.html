  var h = '<div class="sheet-pad"><p class="d-desc" style="margin-top:0">Tell the MISMO team what\'s wrong. ' + esc(p.name) + ' won\'t see who reported them.</p><form id="rp-form" class="rp">' +
    rs.map(function (r, i) { return '<label class="rp-o"><input type="radio" name="rp" value="' + r[0] + '"' + (i ? '' : ' checked') + '><span>' + r[1] + '</span></label>'; }).join('') +
    '<label class="sr" for="rp-note">Details</label><textarea id="rp-note" maxlength="500" rows="3" placeholder="Details (optional)"></textarea>' +
    '<button type="submit" class="btn primary">Send Report</button><div id="rp-msg" role="status"></div></form></div>';
  var el = openSheet('Report ' + p.name, h, { plain: true });
  $('#rp-form', el).addEventListener('submit', function (e) {
    e.preventDefault(); var btn = this.querySelector('button'); btn.disabled = true;
    rq('POST', 'report', { id: id, reason: (this.querySelector('input[name=rp]:checked') || {}).value, note: $('#rp-note', el).value }).then(function (r) {
      btn.disabled = false;
      $('#rp-msg', el).innerHTML = r.ok ? '<div class="ok">Thank you. The MISMO team will look at it.</div>' : '<div class="err">' + esc(r.j.message || 'That didn\'t send. Please try again.') + '</div>';
      if (r.ok) btn.hidden = true;
    });
  });
}

/* messages */
var pollTimer = null;
function threadWith(id) { return A.threads.filter(function (t) { return t.with && t.with.id === id; })[0] || null; }
function seen() { return load('seen:' + S.sid, {}); }
function isUnread(t) { var last = t.m[t.m.length - 1]; return last && !last.mine && last.at > (seen()[t.id] || 0); }
function unreadDot() { var n = A.threads.filter(isUnread).length, d = $('#msg-dot'); d.textContent = n; d.classList.toggle('on', n > 0); }
function pollMessages() {
  clearTimeout(pollTimer);
  if (!A.token) return;
  rq('GET', 'messages').then(function (r) {
    if (r.ok) {
      A.threads = r.j.threads || []; unreadDot();
      var top = topSheet();
      if (top && top.getAttribute('data-key') === 'inbox') paintInbox(top);
      if (top && /^chat:/.test(top.getAttribute('data-key') || '')) paintChat(top, top.getAttribute('data-key').slice(5));
    }
    pollTimer = setTimeout(pollMessages, document.hidden ? 180000 : 45000);
  });
}
document.addEventListener('visibilitychange', function () { if (!document.hidden && A.token) pollMessages(); });
function inboxSheet() {
  var el = openSheet('Messages', '<div class="sheet-pad"><div id="inbox"></div></div>', { plain: true, key: 'inbox' });
  paintInbox(el); pollMessages();
}
function paintInbox(el) {
  var box = $('#inbox', el); if (!box) return;
  if (!A.threads.length) { box.innerHTML = '<div class="note"><b>No messages yet.</b> Find someone in People, Attendees, and tap Message to start a conversation.</div><div class="d-actions" style="margin-top:12px"><button type="button" class="btn primary" data-go="people" data-ptab-go="attendees">' + icon('i-people') + 'See Attendees</button></div>'; return; }
  box.innerHTML = '<div class="list">' + A.threads.map(function (t) {
    var last = t.m[t.m.length - 1] || {};
    return '<button type="button" class="thread' + (isUnread(t) ? ' unread' : '') + '" data-chat="' + esc(t.with.id) + '"><span class="avatar c">' + esc(initials(t.with.name)) + '</span><span style="min-width:0"><div class="n" style="font-weight:600">' + esc(t.with.name) + '</div><div class="last">' + (last.mine ? 'You: ' : '') + esc(last.t || '') + '</div></span><span class="when">' + esc(last.at ? ago(last.at) : '') + '</span></button>';
  }).join('') + '</div>';
}
function chatSheet(id) {
  var who = (threadWith(id) || {}).with || A.people.filter(function (x) { return x.id === id; })[0] || { id: id, name: 'Attendee' };
  var h = '<div class="sheet-pad" style="display:flex;flex-direction:column;min-height:100%"><button type="button" class="chat-who" data-who="' + esc(id) + '">' + icon('i-user') + 'Profile, Block or Report</button><div class="chat" id="chat" style="flex:1"></div>' +
    '<form class="compose" id="compose"><label class="sr" for="chat-text">Message</label><textarea id="chat-text" rows="1" maxlength="1000" placeholder="Write a message"></textarea><button class="btn primary" type="submit">Send</button></form><div id="chat-msg" role="status"></div></div>';
  var el = openSheet(who.name, h, { plain: true, key: 'chat:' + id, focus: '#chat-text' });
  paintChat(el, id);
  $('#compose', el).addEventListener('submit', function (e) {
    e.preventDefault();
    var ta = $('#chat-text', el), text = ta.value.trim(); if (!text) return;
    var btn = this.querySelector('button'); btn.disabled = true; $('#chat-msg', el).innerHTML = '';
    rq('POST', 'message', { to: id, text: text }).then(function (r) {
      btn.disabled = false;
      if (!r.ok) { $('#chat-msg', el).innerHTML = '<div class="err">' + esc((r.j.problems && r.j.problems[0]) || r.j.message || 'Your message wasn\'t sent. Try again.') + '</div>'; return; }
      ta.value = '';
      var t = threadWith(id);
      if (!t) { t = { id: r.j.thread, with: who, m: [], at: Date.now() }; A.threads.unshift(t); }
      t.m.push({ mine: true, t: text, at: Date.now() }); paintChat(el, id);
      setTimeout(pollMessages, 1500);
    });
  });
  $('#chat-text', el).addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); $('#compose', el).requestSubmit(); } });
}
function paintChat(el, id) {
  var box = $('#chat', el); if (!box) return;
  var t = threadWith(id);
  if (!t || !t.m.length) { box.innerHTML = '<div class="note">Say hello. Messages stay in MyMISMO; nobody is emailed.</div>'; return; }
  box.innerHTML = t.m.map(function (m) { return '<div class="bub ' + (m.mine ? 'me' : 'them') + '">' + esc(m.t) + '<small>' + esc(ago(m.at)) + '</small></div>'; }).join('');
  var s = seen(); s[t.id] = Math.max(s[t.id] || 0, (t.m[t.m.length - 1] || {}).at || 0); save('seen:' + S.sid, s); unreadDot();
  var body = el.querySelector('.sheet-body'); body.scrollTop = body.scrollHeight;
}
function toastSheet(title, text) { openSheet(title, '<div class="sheet-pad"><p style="margin-top:0">' + esc(text) + '</p><button type="button" class="btn primary" data-signin>Sign In</button></div>', { plain: true }); }

/* ---------- calendar files ---------- */
function icsDate(iso, m) { return iso.replace(/-/g, '') + 'T' + ('0' + Math.floor(m / 60)).slice(-2) + ('0' + (m % 60)).slice(-2) + '00'; }
function icsText(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1'); }
function fold(line) { var out = '', i = 0; while (line.length - i > 74) { out += line.slice(i, i + 74) + '\r\n '; i += 74; } return out + line.slice(i); }
function ics(list) {
  var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z'), tz = S.zone ? ';TZID=' + S.zone : '';
  var lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//MISMO//MyMISMO//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'];
  list.forEach(function (x) {
    lines.push('BEGIN:VEVENT', 'UID:' + slug(S.sid + '-' + x.id) + '@resources.mismo.org', 'DTSTAMP:' + stamp,
      'DTSTART' + tz + ':' + icsDate(x.date, x.a), 'DTEND' + tz + ':' + icsDate(x.date, x.b == null ? x.a + 60 : x.b),
      fold('SUMMARY:' + icsText(x.title)), fold('LOCATION:' + icsText([x.room, S.summit.city].filter(Boolean).join(', '))),
      fold('DESCRIPTION:' + icsText([S.summit.name, x.type, x.desc].filter(Boolean).join('\n'))),
      'BEGIN:VALARM', 'TRIGGER:-PT15M', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsText(x.title), 'END:VALARM', 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' }));
  a.download = (list.length === 1 ? slug(list[0].title) : 'my-' + slug(S.summit.name) + '-schedule') + '.ics';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- install hint ---------- */
var deferred = null;
function standalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function installHint() {
  if (standalone() || load('install-dismissed', false)) return;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var box = $('#install'), txt = $('#install-text'), go = $('#install-go');
  if (ios) { txt.innerHTML = '<b>Put MyMISMO on your Home Screen.</b> Tap <svg width="16" height="16" style="vertical-align:-3px" aria-label="Share"><use href="#i-share"/></svg> Share, then Add to Home Screen.'; box.classList.add('on'); }
  else if (deferred) { txt.innerHTML = '<b>Install MyMISMO</b> to open it like an app.'; go.hidden = false; box.classList.add('on'); }
}
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; installHint(); });

  if (t.hasAttribute('data-walk')) { walkSheet(t.getAttribute('data-walk')); return; }
  if (t.hasAttribute('data-scan')) { scanHub(null, t.getAttribute('data-scan')); return; }

  if (t.hasAttribute('data-ph-review')) { phReview(); return; }

  if (t.hasAttribute('data-attend')) { attendanceSheet(); return; }
  if (t.hasAttribute('data-scans')) { scansSheet(); return; }

  if (t.hasAttribute('data-play')) { playIn(t.closest('.player'), t.getAttribute('data-play')); return; }
  if (t.hasAttribute('data-live')) { liveSheet(); return; }

  if (t.hasAttribute('data-webinars')) { webinarsSheet(); return; }
  if (t.hasAttribute('data-matters')) { mattersSheet(); return; }
  if (t.hasAttribute('data-certs')) { certsSheet(); return; }
  if (t.hasAttribute('data-trivia')) { triviaSheet(); return; }
  if (t.hasAttribute('data-merch')) { merchSheet(); return; }
  if (t.hasAttribute('data-groups')) { wgSheet(); return; }
  if (t.hasAttribute('data-wg')) { wgDetail(t.getAttribute('data-wg')); return; }
  if (t.hasAttribute('data-web')) { webSheet(t.getAttribute('data-web'), t.getAttribute('data-web-title') || ''); return; }
  if (t.hasAttribute('data-web-ics')) { var wb = upcomingWebinars().filter(function (w) { return w.id === t.getAttribute('data-web-ics'); })[0]; if (wb) webinarIcs(wb); return; }
  if (t.hasAttribute('data-bio')) { var bb = document.getElementById(t.getAttribute('data-bio')); if (bb) { bb.hidden = !bb.hidden; t.innerHTML = icon('i-user') + (bb.hidden ? 'View Bio' : 'Hide Bio'); t.setAttribute('aria-expanded', String(!bb.hidden)); } return; }
  if (t.hasAttribute('data-more')) { var mb = $('#' + t.getAttribute('data-more')); if (mb) { mb.hidden = !mb.hidden; t.textContent = mb.hidden ? 'Read More' : 'Show Less'; t.setAttribute('aria-expanded', String(!mb.hidden)); } return; }
  if (t.hasAttribute('data-go-agenda')) { S.day = t.getAttribute('data-day'); S.q = ''; closeSheet(true); show('agenda'); return; }
  if (t.hasAttribute('data-go')) { if (t.hasAttribute('data-ptab-go')) S.peopleTab = t.getAttribute('data-ptab-go'); closeSheet(true); show(t.getAttribute('data-go')); return; }
  if (t.hasAttribute('data-star')) { e.stopPropagation(); toggleMine(t.getAttribute('data-star'), t); return; }
  if (t.hasAttribute('data-toggle-mine')) { toggleMine(t.getAttribute('data-toggle-mine')); return; }
  if (t.hasAttribute('data-ics')) {
    var v = t.getAttribute('data-ics');
    ics(v === 'all' ? mine().map(sessionById).filter(Boolean).sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.a - b.a; }) : [sessionById(v)].filter(Boolean));
    return;
  }
  if (t.hasAttribute('data-open')) {
    e.preventDefault();

  if (t.hasAttribute('data-episode')) { micdupSheet(t.getAttribute('data-episode')); return; }
  if (t.hasAttribute('data-micdup')) { micdupSheet(); return; }
  if (t.hasAttribute('data-sitelinks')) { siteSheet(); return; }
  if (t.hasAttribute('data-signin')) { closeSheet(true); signInSheet(); return; }
  if (t.hasAttribute('data-profile')) { profileSheet(false); return; }
  if (t.hasAttribute('data-chat')) { chatSheet(t.getAttribute('data-chat')); return; }
  if (t.hasAttribute('data-report')) { reportSheet(t.getAttribute('data-report')); return; }
  if (t.hasAttribute('data-wifi-copy')) {
    var wc = wifiInfo(); if (!wc) return;

  if (t.id === 'set-btn') { settingsSheet(); return; }
  if (t.hasAttribute('data-myname')) { S.focusName = true; settingsSheet(); return; }
  if (t.id === 'acct-btn') { if (A.token) profileSheet(false); else signInSheet(); return; }
  if (t.id === 'msg-btn') { inboxSheet(); return; }
  if (t.id === 'install-x') { save('install-dismissed', true); $('#install').classList.remove('on'); return; }
  if (t.id === 'install-go' && deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; $('#install').classList.remove('on'); }); return; }

$('#sheet-back').addEventListener('click', function () { closeSheet(true); });

});

(function theme() {

/* ---------- start ---------- */

    if (!r.ok) throw new Error(FEED_AGENDA + ' ' + r.status);

  }).then(function (feed) {

  }).catch(function (err) {
    S.loadErr = navigator.onLine === false ? 'You\'re offline. Connect once and the summit will be saved to this phone.' : 'The summit couldn\'t be loaded right now. Try again in a moment.';
    if (window.console) console.error(err);

    if (S.summit) { checkReady(); checkSlides(); }
    checkPush();
    openFromLink();
    loadExtras();
  });
}
start();
setInterval(function () { if (S.summit && (S.page === 'home' || S.page === 'agenda' || S.page === 'dash') && !stack.length && !(document.activeElement && document.activeElement.matches('input,textarea'))) renderPage(S.page); }, 60000);
/* Keep the installed app current: check for a new version whenever it's opened or brought back, and when one
   arrives, reload (right away if nothing is open, otherwise as soon as the open panels are closed). */

function reloadWhenFree() { if (!stack.length) location.reload(); else RELOAD_WAITING = true; }
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  var hadSW = !!navigator.serviceWorker.controller;
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadSW) reloadWhenFree(); hadSW = true; });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }).catch(function () {});
  });
}
})();
